# cargo-deny configuration for security auditing
# Run with: cargo deny check

[advisories]
# Vulnerabilities remain errors. Preserve the former maintenance-only warning
# policy for these existing dependencies; cargo audit still reports the notices.
# New maintenance advisories remain errors until explicitly reviewed.
unmaintained = "all"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "Maintenance-only notice; bincode 1.3.3 is the existing durable wire format. Migration needs a separate compatibility design." },
    { id = "RUSTSEC-2025-0057", reason = "Maintenance-only notice in the existing HTML parser dependency graph." },
    { id = "RUSTSEC-2025-0119", reason = "Maintenance-only notice in the existing progress display dependency graph." },
    { id = "RUSTSEC-2025-0134", reason = "Maintenance-only notice in existing tonic TLS dependencies; vulnerability advisories are not ignored." },
]

[licenses]
# Unlicensed dependencies are rejected by default.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

# Existing HTML parser dependencies previously fell under copyleft = "warn".
# Name them explicitly; do not allow new copyleft dependencies by default.
exceptions = [
    { crate = "cssparser@0.34.0", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros@0.6.1", allow = ["MPL-2.0"] },
    { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
    { crate = "selectors@0.26.0", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Deny specific crates with known issues
deny = [
    # Example: { name = "openssl", wrappers = ["openssl-sys"] }
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
