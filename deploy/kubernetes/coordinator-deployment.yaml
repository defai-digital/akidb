---
# AkiDB Coordinator Deployment
# The coordinator handles fan-out search and routing
apiVersion: apps/v1
kind: Deployment
metadata:
  name: akidb-coordinator
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: coordinator
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: akidb
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akidb
        app.kubernetes.io/component: coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - coordinator
              topologyKey: kubernetes.io/hostname
      containers:
      - name: akidb-coordinator
        image: akidb/akidb-coordinator:latest
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 50051
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: akidb-config
        - configMapRef:
            name: akidb-coordinator-config
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      securityContext:
        fsGroup: 1000
---
# Coordinator Service (LoadBalancer/ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: akidb-coordinator
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: coordinator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: coordinator
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
  - name: metrics
    port: 9090
    targetPort: metrics
---
# HPA for Coordinator
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: akidb-coordinator-hpa
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: coordinator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: akidb-coordinator
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
---
# PodDisruptionBudget for Coordinator
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: akidb-coordinator-pdb
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: coordinator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: akidb
      app.kubernetes.io/component: coordinator
