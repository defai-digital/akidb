---
# AkiDB Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: akidb-config
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: config
data:
  # Server configuration
  AKIDB_HOST: "0.0.0.0"
  AKIDB_PORT: "50051"
  AKIDB_GRPC_MAX_MESSAGE_SIZE: "16777216"  # 16MB

  # Index configuration
  AKIDB_DIMENSIONS: "768"
  AKIDB_NLIST: "1024"
  AKIDB_NPROBE: "32"
  AKIDB_INDEX_TYPE: "IVF_FLAT"

  # GPU configuration
  AKIDB_GPU_ENABLED: "true"
  AKIDB_GPU_MEMORY_FRACTION: "0.6"
  AKIDB_GPU_DEVICE_ID: "0"

  # cuVS configuration (Phase 4)
  AKIDB_CUVS_ENABLED: "false"  # Enable via rollout
  AKIDB_CUVS_SHADOW_MODE: "true"
  AKIDB_CUVS_ALGORITHM: "CAGRA"

  # Storage configuration
  AKIDB_DATA_DIR: "/data/akidb"
  AKIDB_WAL_DIR: "/data/akidb/wal"
  AKIDB_SNAPSHOT_DIR: "/data/akidb/snapshots"

  # RocksDB configuration
  AKIDB_ROCKSDB_WRITE_BUFFER_SIZE: "67108864"  # 64MB
  AKIDB_ROCKSDB_MAX_WRITE_BUFFER_NUMBER: "3"
  AKIDB_ROCKSDB_BLOCK_CACHE_SIZE: "268435456"  # 256MB

  # Observability
  AKIDB_METRICS_PORT: "9090"
  AKIDB_TRACING_ENABLED: "true"
  AKIDB_TRACING_ENDPOINT: "http://jaeger-collector:14268/api/traces"
  AKIDB_LOG_LEVEL: "info"

  # Compaction configuration
  AKIDB_TOMBSTONE_THRESHOLD: "0.10"
  AKIDB_COMPACTION_INTERVAL_SECS: "3600"
  AKIDB_SCHEDULED_COMPACTION_HOUR: "3"

  # SLO configuration
  AKIDB_TARGET_P50_MS: "10"
  AKIDB_TARGET_P95_MS: "50"
  AKIDB_TARGET_P99_MS: "100"
---
# Coordinator-specific configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: akidb-coordinator-config
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: coordinator
data:
  # Coordinator settings
  AKIDB_ROLE: "coordinator"
  AKIDB_SHARD_COUNT: "4"
  AKIDB_VIRTUAL_NODES: "100"

  # Fan-out settings
  AKIDB_FANOUT_TIMEOUT_MS: "1000"
  AKIDB_FANOUT_MAX_CONCURRENT: "10"

  # Backpressure settings
  AKIDB_BACKPRESSURE_MAX_CONCURRENT: "100"
  AKIDB_BACKPRESSURE_SOFT_LIMIT: "80"

  # Shard addresses (populated by StatefulSet DNS)
  AKIDB_SHARD_ADDRESSES: "akidb-shard-0.akidb-shard.akidb.svc.cluster.local:50051,akidb-shard-1.akidb-shard.akidb.svc.cluster.local:50051,akidb-shard-2.akidb-shard.akidb.svc.cluster.local:50051,akidb-shard-3.akidb-shard.akidb.svc.cluster.local:50051"
