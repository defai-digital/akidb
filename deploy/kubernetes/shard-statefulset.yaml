---
# AkiDB Shard StatefulSet
# Each shard handles a portion of the vector data with GPU acceleration
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: akidb-shard
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: shard
spec:
  serviceName: akidb-shard
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: akidb
      app.kubernetes.io/component: shard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akidb
        app.kubernetes.io/component: shard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                  - shard
              topologyKey: kubernetes.io/hostname
      containers:
      - name: akidb-shard
        image: akidb/akidb-server:latest
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 50051
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        envFrom:
        - configMapRef:
            name: akidb-config
        env:
        - name: AKIDB_ROLE
          value: "shard"
        - name: AKIDB_SHARD_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: "2"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: data
          mountPath: /data/akidb
        - name: shm
          mountPath: /dev/shm
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30  # Allow up to 2.5 minutes for startup
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      securityContext:
        fsGroup: 1000
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app.kubernetes.io/name: akidb
        app.kubernetes.io/component: shard
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fast-nvme
      resources:
        requests:
          storage: 100Gi
---
# Headless service for StatefulSet DNS
apiVersion: v1
kind: Service
metadata:
  name: akidb-shard
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: shard
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: shard
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
  - name: metrics
    port: 9090
    targetPort: metrics
