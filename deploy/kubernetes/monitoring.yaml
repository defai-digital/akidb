---
# ServiceMonitor for Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: akidb-monitor
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: akidb
  namespaceSelector:
    matchNames:
    - akidb
  endpoints:
  - port: metrics
    interval: 15s
    path: /metrics
    scrapeTimeout: 10s
---
# PrometheusRule for alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: akidb-alerts
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
    app.kubernetes.io/component: monitoring
spec:
  groups:
  - name: akidb.rules
    rules:
    # High latency alert
    - alert: AkiDBHighLatency
      expr: histogram_quantile(0.95, sum(rate(akidb_search_latency_seconds_bucket[5m])) by (le)) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "AkiDB search latency is high"
        description: "P95 search latency is {{ $value | humanizeDuration }} (threshold: 50ms)"

    # Critical latency alert
    - alert: AkiDBCriticalLatency
      expr: histogram_quantile(0.99, sum(rate(akidb_search_latency_seconds_bucket[5m])) by (le)) > 0.1
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "AkiDB search latency is critically high"
        description: "P99 search latency is {{ $value | humanizeDuration }} (threshold: 100ms)"

    # Error rate alert
    - alert: AkiDBHighErrorRate
      expr: sum(rate(akidb_request_errors_total[5m])) / sum(rate(akidb_requests_total[5m])) > 0.01
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "AkiDB error rate is elevated"
        description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

    # GPU memory alert
    - alert: AkiDBHighGPUMemory
      expr: akidb_gpu_memory_used_bytes / akidb_gpu_memory_total_bytes > 0.85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "AkiDB GPU memory usage is high"
        description: "GPU memory usage is {{ $value | humanizePercentage }} (threshold: 85%)"

    # Shard down alert
    - alert: AkiDBShardDown
      expr: up{job="akidb-shard"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AkiDB shard is down"
        description: "Shard {{ $labels.instance }} is not responding"

    # Coordinator down alert
    - alert: AkiDBCoordinatorDown
      expr: up{job="akidb-coordinator"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AkiDB coordinator is down"
        description: "Coordinator {{ $labels.instance }} is not responding"

    # Tombstone threshold alert
    - alert: AkiDBHighTombstoneRatio
      expr: akidb_tombstone_ratio > 0.15
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "AkiDB tombstone ratio is high"
        description: "Tombstone ratio is {{ $value | humanizePercentage }} (threshold: 15%)"

    # Rebuild in progress alert (informational)
    - alert: AkiDBRebuildInProgress
      expr: akidb_rebuild_in_progress == 1
      for: 1m
      labels:
        severity: info
      annotations:
        summary: "AkiDB index rebuild is in progress"
        description: "Shard {{ $labels.shard_id }} is rebuilding"

    # Rebuild taking too long
    - alert: AkiDBRebuildSlow
      expr: akidb_rebuild_in_progress == 1
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: "AkiDB rebuild is taking too long"
        description: "Shard {{ $labels.shard_id }} has been rebuilding for over 30 minutes"

    # cuVS divergence alert (Phase 4)
    - alert: AkiDBCuVSDivergence
      expr: akidb_cuvs_divergence_rate > 0.001
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "cuVS results diverging from FAISS"
        description: "Divergence rate is {{ $value | humanizePercentage }} (threshold: 0.1%)"

    # Backpressure active alert
    - alert: AkiDBBackpressureActive
      expr: akidb_backpressure_active == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "AkiDB backpressure is active"
        description: "System is under load and rejecting requests"
---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: akidb-network-policy
  namespace: akidb
  labels:
    app.kubernetes.io/name: akidb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: akidb
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from other AkiDB pods
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: akidb
    ports:
    - protocol: TCP
      port: 50051
    - protocol: TCP
      port: 9090
  # Allow traffic from Prometheus
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9090
  # Allow external gRPC traffic to coordinator
  - from: []
    ports:
    - protocol: TCP
      port: 50051
  egress:
  # Allow traffic to other AkiDB pods
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: akidb
    ports:
    - protocol: TCP
      port: 50051
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow MinIO access
  - to:
    - namespaceSelector:
        matchLabels:
          name: minio
    ports:
    - protocol: TCP
      port: 9000
  # Allow Jaeger/tracing
  - to:
    - namespaceSelector:
        matchLabels:
          name: tracing
    ports:
    - protocol: TCP
      port: 14268
