# AkiDB Thor Edition - Prometheus Alerting Rules
# Complete alerting configuration for production deployment

groups:
  # ============================================
  # Recording Rules
  # ============================================
  - name: akidb_recording_rules
    interval: 15s
    rules:
      # Search QPS
      - record: akidb:search_qps:rate1m
        expr: rate(akidb_coordinator_requests_total{operation="search",status="success"}[1m])

      # Fanout latency percentiles
      - record: akidb:fanout_latency_p50:rate5m
        expr: histogram_quantile(0.50, rate(akidb_coordinator_fanout_latency_seconds_bucket[5m]))

      - record: akidb:fanout_latency_p95:rate5m
        expr: histogram_quantile(0.95, rate(akidb_coordinator_fanout_latency_seconds_bucket[5m]))

      - record: akidb:fanout_latency_p99:rate5m
        expr: histogram_quantile(0.99, rate(akidb_coordinator_fanout_latency_seconds_bucket[5m]))

      # Error rate
      - record: akidb:error_rate:rate5m
        expr: |
          rate(akidb_coordinator_requests_total{status="error"}[5m])
          / rate(akidb_coordinator_requests_total[5m])

      # Healthy shards count
      - record: akidb:healthy_shards_count
        expr: sum(akidb_coordinator_shard_health == 1)

      # Total vectors across all shards
      - record: akidb:total_vectors:sum
        expr: sum(akidb_active_vectors)

      # GPU memory usage across shards
      - record: akidb:gpu_memory_bytes:sum
        expr: sum(akidb_gpu_memory_bytes)

      # Ingestion throughput
      - record: akidb:ingestion_docs_per_minute:rate5m
        expr: rate(akidb_ingestion_documents_processed_total[5m]) * 60

      - record: akidb:ingestion_vectors_per_minute:rate5m
        expr: rate(akidb_ingestion_vectors_inserted_total[5m]) * 60

  # ============================================
  # Core AkiDB Alerts
  # ============================================
  - name: akidb_core_alerts
    rules:
      # Shard health
      - alert: AkiDBShardUnhealthy
        expr: akidb_coordinator_shard_health == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "AkiDB shard {{ $labels.shard }} is unhealthy"
          description: "Shard {{ $labels.shard }} has been unhealthy for more than 1 minute"
          runbook_url: "https://docs.akidb.io/runbook#shard-unhealthy"

      - alert: AkiDBAllShardsDown
        expr: akidb:healthy_shards_count == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "All AkiDB shards are down"
          description: "No healthy shards available - service is unavailable"
          runbook_url: "https://docs.akidb.io/runbook#all-shards-down"

      # Latency SLO
      - alert: AkiDBHighLatency
        expr: akidb:fanout_latency_p95:rate5m > 0.010
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AkiDB P95 latency exceeds 10ms SLO"
          description: "P95 search latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.akidb.io/runbook#high-latency"

      - alert: AkiDBCriticalLatency
        expr: akidb:fanout_latency_p99:rate5m > 0.050
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AkiDB P99 latency exceeds 50ms"
          description: "P99 search latency is {{ $value | humanizeDuration }} - investigate immediately"
          runbook_url: "https://docs.akidb.io/runbook#critical-latency"

      # Partial results
      - alert: AkiDBPartialResults
        expr: rate(akidb_coordinator_partial_results_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AkiDB returning partial results"
          description: "More than 1 partial result per 5 minutes - some shards may be unavailable"
          runbook_url: "https://docs.akidb.io/runbook#partial-results"

      # Error rate
      - alert: AkiDBHighErrorRate
        expr: akidb:error_rate:rate5m > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AkiDB error rate exceeds 1%"
          description: "Error rate is {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.akidb.io/runbook#high-error-rate"

      # GPU memory
      - alert: AkiDBHighGPUMemory
        expr: (akidb:gpu_memory_bytes:sum / (128 * 1024 * 1024 * 1024)) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU memory usage exceeds 90%"
          description: "GPU memory at {{ $value | humanizePercentage }} - may cause OOM"
          runbook_url: "https://docs.akidb.io/runbook#gpu-memory"

  # ============================================
  # Ingestion Pipeline Alerts
  # ============================================
  - name: akidb_ingestion_alerts
    rules:
      # Circuit breaker
      - alert: IngestionCircuitBreakerOpen
        expr: akidb_ingestion_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ingestion circuit breaker is OPEN"
          description: "Python parser service may be down - PDF/DOCX processing halted"
          runbook_url: "https://docs.akidb.io/runbook#circuit-breaker-open"

      - alert: IngestionCircuitBreakerHalfOpen
        expr: akidb_ingestion_circuit_breaker_state == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ingestion circuit breaker is HALF-OPEN"
          description: "Circuit breaker is testing recovery - monitor closely"
          runbook_url: "https://docs.akidb.io/runbook#circuit-breaker-half-open"

      # Backpressure
      - alert: IngestionBackpressureActive
        expr: akidb_ingestion_backpressure_active == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ingestion backpressure is active"
          description: "AkiDB insert latency is high - ingestion throttled"
          runbook_url: "https://docs.akidb.io/runbook#backpressure-active"

      # High insert latency
      - alert: IngestionHighInsertLatency
        expr: histogram_quantile(0.95, rate(akidb_ingestion_insert_latency_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High AkiDB insert latency"
          description: "P95 insert latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.akidb.io/runbook#high-insert-latency"

      # Memory pressure
      - alert: IngestionHighMemory
        expr: akidb_ingestion_memory_usage_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ingestion memory usage above 80%"
          description: "Memory at {{ $value }}% - may trigger pause"
          runbook_url: "https://docs.akidb.io/runbook#high-memory"

      - alert: IngestionCriticalMemory
        expr: akidb_ingestion_memory_usage_percent > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ingestion memory usage critical"
          description: "Memory at {{ $value }}% - OOM risk"
          runbook_url: "https://docs.akidb.io/runbook#critical-memory"

      # Document processing failures
      - alert: IngestionDocumentsFailing
        expr: increase(akidb_ingestion_documents_failed_total[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Multiple document processing failures"
          description: "{{ $value }} documents failed in the last 5 minutes"
          runbook_url: "https://docs.akidb.io/runbook#document-failures"

      # Queue depth
      - alert: IngestionQueueBacklog
        expr: akidb_ingestion_queue_depth > 10000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Large ingestion queue backlog"
          description: "Queue depth is {{ $value }} - processing may be slow"
          runbook_url: "https://docs.akidb.io/runbook#queue-backlog"

      # Throughput drop
      - alert: IngestionThroughputDrop
        expr: akidb:ingestion_docs_per_minute:rate5m < 1 and akidb_ingestion_queue_depth > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Ingestion throughput dropped to zero"
          description: "No documents processed but queue has {{ $value }} pending"
          runbook_url: "https://docs.akidb.io/runbook#throughput-drop"

  # ============================================
  # Infrastructure Alerts
  # ============================================
  - name: akidb_infrastructure_alerts
    rules:
      # NATS cluster
      - alert: NATSClusterDegraded
        expr: count(up{job="nats"} == 1) < 3
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "NATS cluster is degraded"
          description: "Only {{ $value }} NATS nodes are healthy (expected 3)"
          runbook_url: "https://docs.akidb.io/runbook#nats-degraded"

      - alert: NATSClusterDown
        expr: count(up{job="nats"} == 1) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "NATS cluster is down"
          description: "No NATS nodes are healthy - ingestion will fail"
          runbook_url: "https://docs.akidb.io/runbook#nats-down"

      - alert: NATSDLQGrowing
        expr: increase(nats_jetstream_stream_messages{stream="akidb-dlq"}[1h]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DLQ messages growing"
          description: "{{ $value }} messages added to DLQ in the last hour"
          runbook_url: "https://docs.akidb.io/runbook#dlq-growing"

      # MinIO
      - alert: MinIODown
        expr: up{job="minio"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MinIO is down"
          description: "Object storage unavailable - uploads and document fetching will fail"
          runbook_url: "https://docs.akidb.io/runbook#minio-down"

      - alert: MinIODiskSpaceLow
        expr: (minio_node_disk_used_bytes / minio_node_disk_total_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MinIO disk space low"
          description: "Disk usage at {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.akidb.io/runbook#minio-disk-low"

      # Embedding service
      - alert: EmbeddingServiceDown
        expr: up{job="embedding"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Embedding service (vLLM) is down"
          description: "Cannot generate embeddings - ingestion will fail"
          runbook_url: "https://docs.akidb.io/runbook#embedding-down"

      - alert: EmbeddingHighLatency
        expr: histogram_quantile(0.95, rate(vllm_e2e_request_latency_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Embedding latency is high"
          description: "P95 embedding latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.akidb.io/runbook#embedding-latency"

      # Doc parser
      - alert: DocParserDown
        expr: up{job="doc-parser"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Document parser service is down"
          description: "PDF/DOCX parsing will fail - circuit breaker will open"
          runbook_url: "https://docs.akidb.io/runbook#doc-parser-down"

  # ============================================
  # SLO Alerts
  # ============================================
  - name: akidb_slo_alerts
    rules:
      # 30-minute upload-to-searchable SLO
      - alert: SLOUploadToSearchableBreached
        expr: |
          histogram_quantile(0.95, rate(akidb_ingestion_e2e_latency_seconds_bucket[1h])) > 1800
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Upload-to-searchable SLO breached"
          description: "P95 end-to-end latency exceeds 30 minutes"
          runbook_url: "https://docs.akidb.io/runbook#slo-breach"

      # Search availability SLO (99.9%)
      - alert: SLOSearchAvailabilityLow
        expr: |
          (1 - (rate(akidb_coordinator_requests_total{status="error"}[1h]) / rate(akidb_coordinator_requests_total[1h]))) < 0.999
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Search availability below 99.9%"
          description: "Search availability at {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.akidb.io/runbook#availability-slo"
