# MinIO Docker Compose for AkiDB Development
# For production on Thor, use minio-setup.sh instead

version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: akidb-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: akidb-admin
      MINIO_ROOT_PASSWORD: akidb-secret-key
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Initialize bucket on startup
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set akidb http://minio:9000 akidb-admin akidb-secret-key;
      mc mb akidb/akidb-snapshots --ignore-existing;
      mc mb akidb/akidb-wal --ignore-existing;
      echo 'Buckets created successfully';
      "

volumes:
  minio-data:
    driver: local
