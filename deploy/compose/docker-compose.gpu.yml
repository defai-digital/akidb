# AkiDB Thor Edition - GPU Override
# Use with: docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up

version: "3.9"

services:
  # ============================================
  # Embedding Service with GPU
  # ============================================
  embedding:
    image: vllm/vllm-openai:latest
    container_name: akidb-embedding
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/data/huggingface
    command:
      - "--model"
      - "Qwen/Qwen3-Embedding-8B"
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.8"
    ports:
      - "8000:8000"
    volumes:
      - embedding-models:/data/huggingface
    networks:
      - akidb-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ============================================
  # AkiDB Core with GPU FAISS
  # ============================================
  akidb-server:
    build:
      context: ../..
      dockerfile: deploy/compose/akidb/Dockerfile.gpu
      args:
        CUDA_VERSION: "12.0"
    container_name: akidb-server
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - RUST_LOG=info
      - AKIDB_FAISS_GPU=1
      - AKIDB_GPU_DEVICE=0
    ports:
      - "50051:50051"   # gRPC
      - "9091:9091"     # Metrics
    volumes:
      - akidb-data:/var/lib/akidb
    networks:
      - akidb-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      embedding:
        condition: service_healthy

  # Update ingestion to use embedding service
  ingestion:
    environment:
      EMBEDDING_URL: http://embedding:8000
      AKIDB_URL: http://akidb-server:50051

volumes:
  embedding-models:
  akidb-data:
