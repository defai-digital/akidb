# AkiDB Docker Compose
# Portable local development stack (published images currently target AMD64)

services:
  # ============================================
  # NATS JetStream Cluster (3-node)
  # ============================================
  nats-1:
    image: nats:2.11.15-alpine
    command: >
      -c /etc/nats/nats.conf
      --name nats-1
      --routes nats://nats-2:6222,nats://nats-3:6222
      --connect_retries 120
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"   # Client connections
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"  # Monitoring
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-1-data:/data
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  nats-2:
    image: nats:2.11.15-alpine
    command: >
      -c /etc/nats/nats.conf
      --name nats-2
      --routes nats://nats-1:6222
      --connect_retries 120
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-2-data:/data
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  nats-3:
    image: nats:2.11.15-alpine
    command: >
      -c /etc/nats/nats.conf
      --name nats-3
      --routes nats://nats-1:6222
      --connect_retries 120
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-3-data:/data
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.1
    command:
      - -varz
      - -connz
      - -routez
      - -healthz
      - -jsz=all
      - http://nats-1:8222
      - http://nats-2:8222
      - http://nats-3:8222
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy

  # ============================================
  # SeaweedFS Object Storage
  # ============================================
  # One process per node runs master, volume, filer, and the S3 gateway
  # (`-s3` implies `-filer`). The gateway authenticates every request against
  # the identities in /etc/seaweedfs/s3.json; with no configuration file it
  # allows anonymous access to everything, so the generator below is the gate
  # that keeps the gateway authenticated.
  #
  # SeaweedFS does not implement S3 bucket notifications, so object-created
  # events no longer fan out from the object store into NATS. Stored objects
  # reach the ingestion path through the upload gateway's own NATS publish
  # (seaweedfs.uploads...), and the ingestion scheduler's periodic
  # bucket/manifest sync covers objects written by any other route.
  seaweedfs-config:
    image: chrislusf/seaweedfs:4.47
    user: "1000:1000"
    read_only: true
    entrypoint: ["/bin/sh"]
    command: ["/setup/gen-s3-config.sh"]
    environment:
      SEAWEEDFS_ACCESS_KEY_FILE: /run/secrets/seaweedfs_access_key
      SEAWEEDFS_SECRET_KEY_FILE: /run/secrets/seaweedfs_secret_key
      SEAWEEDFS_S3_CONFIG: /etc/seaweedfs/s3.json
    volumes:
      - ./seaweedfs/gen-s3-config.sh:/setup/gen-s3-config.sh:ro
      - seaweedfs-config:/etc/seaweedfs
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - seaweedfs_access_key
      - seaweedfs_secret_key

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    user: "1000:1000"
    command:
      - server
      - -dir=/data
      - -ip.bind=0.0.0.0
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -volume.max=0
      # `-volume.max=0` derives the volume count from free space divided by the
      # volume size, and every bucket (collection) needs its own volume. At the
      # 1024 MB default a host with ~6 GB free gets 5 volumes, so the second
      # bucket can be created but not written to. 128 MB keeps a small dev host
      # usable.
      - -master.volumeSizeLimitMB=128
      - -metricsPort=9327
    ports:
      - "127.0.0.1:${SEAWEEDFS_API_PORT:-8333}:8333"       # S3 API
      - "127.0.0.1:${SEAWEEDFS_MASTER_PORT:-9333}:9333"   # Master UI/API
    volumes:
      - seaweedfs-data:/data
      - seaweedfs-config:/etc/seaweedfs:ro
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      seaweedfs-config:
        condition: service_completed_successfully

  # SeaweedFS bucket setup - one `weed shell` invocation per bucket because the
  # shell reports only the status of the last piped command.
  seaweedfs-init:
    image: chrislusf/seaweedfs:4.47
    user: "1000:1000"
    read_only: true
    entrypoint: ["/bin/sh"]
    command: ["/setup/create-buckets.sh"]
    environment:
      HOME: /tmp
      SEAWEEDFS_MASTER: seaweedfs:9333
      SEAWEEDFS_BUCKETS: akidb-documents akidb-snapshots
    volumes:
      - ./seaweedfs/create-buckets.sh:/setup/create-buckets.sh:ro
    tmpfs:
      - /tmp:mode=1777,size=64M
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      seaweedfs:
        condition: service_healthy

  # ============================================
  # Upload Gateway
  # ============================================
  upload-gateway:
    build:
      context: ../../services/upload-gateway
      dockerfile: Dockerfile
    user: "1000:1000"
    read_only: true
    ports:
      - "127.0.0.1:${UPLOAD_GATEWAY_PORT:-8081}:8081"
    environment:
      UPLOAD_GATEWAY_SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      UPLOAD_GATEWAY_SEAWEEDFS_ACCESS_KEY_FILE: /run/secrets/seaweedfs_access_key
      UPLOAD_GATEWAY_SEAWEEDFS_SECRET_KEY_FILE: /run/secrets/seaweedfs_secret_key
      UPLOAD_GATEWAY_NATS_URL: ${NATS_URL:-nats://nats-1:4222}
      UPLOAD_GATEWAY_NATS_STREAM: ${NATS_STREAM:-INGESTION}
      UPLOAD_GATEWAY_NATS_REPLICAS: ${NATS_REPLICAS:-3}
      UPLOAD_GATEWAY_LOG_LEVEL: INFO
    tmpfs:
      - /tmp:mode=1777,size=256M
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - seaweedfs_access_key
      - seaweedfs_secret_key
    depends_on:
      seaweedfs:
        condition: service_healthy
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully

  # ============================================
  # Document Parser (Python sidecar)
  # ============================================
  doc-parser:
    build:
      context: ../../services/doc-parser
      dockerfile: Dockerfile
    user: "1000:1000"
    read_only: true
    ports:
      - "127.0.0.1:${DOC_PARSER_PORT:-8080}:8080"
    environment:
      DOC_PARSER_LOG_LEVEL: INFO
      DOC_PARSER_MAX_FILE_SIZE_MB: 100
    tmpfs:
      - /tmp:mode=1777,size=512M
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ============================================
  # Ingestion Orchestrator (Rust)
  # ============================================
  ingestion:
    build:
      context: ../..
      dockerfile: deploy/compose/ingestion/Dockerfile
    user: "1000:1000"
    environment:
      NATS_URL: ${NATS_URL:-nats://nats-1:4222}
      NATS_STREAM: ${NATS_STREAM:-INGESTION}
      NATS_CONSUMER: ${NATS_CONSUMER:-ingestion-orchestrator}
      NATS_DLQ_STREAM: ${NATS_DLQ_STREAM:-akidb-dlq}
      NATS_REPLICAS: ${NATS_REPLICAS:-3}
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_ACCESS_KEY_FILE: /run/secrets/seaweedfs_access_key
      STORAGE_SECRET_KEY_FILE: /run/secrets/seaweedfs_secret_key
      STORAGE_BUCKET: akidb-documents
      AKIDB_ENDPOINT: http://akidb-server:50051
      AKIDB_TIMEOUT_MS: ${AKIDB_TIMEOUT_MS:-30000}
      AKIDB_MAX_RETRIES: ${AKIDB_MAX_RETRIES:-3}
      DOC_PARSER_URL: http://doc-parser:8080
      EMBEDDING_URL: ${EMBEDDING_URL:-http://host.docker.internal:8000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-4B}
      INGESTION_METRICS_ADDR: 0.0.0.0:9093
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
    volumes:
      - ingestion-state:/var/lib/akidb
    tmpfs:
      - /tmp:mode=1777,size=256M
    networks:
      - akidb-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - seaweedfs_access_key
      - seaweedfs_secret_key
    depends_on:
      nats-1:
        condition: service_healthy
      doc-parser:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      akidb-server:
        condition: service_healthy

  # ============================================
  # AkiDB Server (Vector Database Shard)
  # ============================================
  akidb-server:
    build:
      context: ../..
      dockerfile: deploy/docker/akidb-server.Dockerfile
    user: "1000:1000"
    ports:
      - "127.0.0.1:50051:50051"   # gRPC
      - "127.0.0.1:9092:9090"     # Metrics (mapped to avoid conflict with prometheus)
    environment:
      RUST_LOG: info
      AKIDB_DATA_DIR: /var/lib/akidb/data
      AKIDB_WAL_DIR: /var/lib/akidb/wal
      AKIDB_LISTEN_ADDR: 0.0.0.0:50051
      AKIDB_METRICS_ADDR: 0.0.0.0:9090
      AKIDB_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-2560}
      # The coordinator cannot propagate shard credentials yet. This exception
      # is restricted to the private Compose network and loopback host ports.
      AKIDB_AUTH_MODE: disabled
    volumes:
      - akidb-server-data:/var/lib/akidb
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ============================================
  # AkiDB Coordinator (Query Router)
  # ============================================
  akidb-coordinator:
    build:
      context: ../..
      dockerfile: deploy/docker/akidb-coordinator.Dockerfile
    user: "1000:1000"
    ports:
      - "127.0.0.1:50052:50052"   # gRPC
      - "127.0.0.1:9091:9091"     # Metrics
    environment:
      RUST_LOG: info
      AKIDB_COORDINATOR_LISTEN_ADDR: 0.0.0.0:50052
      AKIDB_COORDINATOR_METRICS_HOST: 0.0.0.0
      AKIDB_COORDINATOR_METRICS_PORT: 9091
      AKIDB_SHARD_ADDRS: akidb-server:50051
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      akidb-server:
        condition: service_healthy

  # ============================================
  # Prometheus (Monitoring)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    user: "65534:65534"  # nobody user for prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - nats-exporter

  # ============================================
  # Grafana (Dashboards)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    user: "472:472"  # grafana user
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cluster-health.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus

networks:
  akidb-net:
    driver: bridge

volumes:
  nats-1-data:
  nats-2-data:
  nats-3-data:
  seaweedfs-data:
  seaweedfs-config:
  ingestion-state:
  akidb-server-data:
  prometheus-data:
  grafana-data:

# ============================================
# Secrets (ADR-021 Security Hardening)
# ============================================
secrets:
  seaweedfs_access_key:
    file: ./secrets/seaweedfs_access_key.txt
  seaweedfs_secret_key:
    file: ./secrets/seaweedfs_secret_key.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
