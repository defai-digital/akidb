# AkiDB Docker Compose
# Portable local development stack (published images currently target AMD64)

services:
  # ============================================
  # NATS JetStream Cluster (3-node)
  # ============================================
  nats-1:
    image: nats:2.11.15-alpine
    command: >
      -c /etc/nats/nats.conf
      --name nats-1
      --routes nats://nats-2:6222,nats://nats-3:6222
      --connect_retries 120
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"   # Client connections
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"  # Monitoring
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-1-data:/data
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  nats-2:
    image: nats:2.11.15-alpine
    command: >
      -c /etc/nats/nats.conf
      --name nats-2
      --routes nats://nats-1:6222
      --connect_retries 120
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-2-data:/data
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  nats-3:
    image: nats:2.11.15-alpine
    command: >
      -c /etc/nats/nats.conf
      --name nats-3
      --routes nats://nats-1:6222
      --connect_retries 120
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats-3-data:/data
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.20.1
    command:
      - -varz
      - -connz
      - -routez
      - -healthz
      - -jsz=all
      - http://nats-1:8222
      - http://nats-2:8222
      - http://nats-3:8222
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy

  # ============================================
  # MinIO Object Storage
  # ============================================
  minio-init:
    image: minio/minio:latest
    user: "0:0"
    read_only: true
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    volumes:
      - minio-data:/data
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN

  minio:
    image: minio/minio:latest
    user: "1000:1000"
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"       # API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"   # Console
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      MINIO_NOTIFY_NATS_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_NATS_ADDRESS_PRIMARY: "nats-1:4222"
      MINIO_NOTIFY_NATS_SUBJECT_PRIMARY: "minio.uploads"
      MINIO_NOTIFY_NATS_JETSTREAM_PRIMARY: "on"
      MINIO_NOTIFY_NATS_STREAMING_ASYNC_PRIMARY: "on"
    volumes:
      - minio-data:/data
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - minio_root_user
      - minio_root_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      nats-1:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # MinIO setup - creates bucket and configures notifications
  minio-setup:
    image: minio/mc:latest
    user: "1000:1000"
    read_only: true
    entrypoint: /bin/sh
    command: /setup/setup-minio.sh
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - ./minio/setup-minio.sh:/setup/setup-minio.sh:ro
    tmpfs:
      - /tmp:mode=1777,size=64M
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - minio_root_user
      - minio_root_password
    depends_on:
      minio:
        condition: service_healthy

  # ============================================
  # Upload Gateway
  # ============================================
  upload-gateway:
    build:
      context: ../../services/upload-gateway
      dockerfile: Dockerfile
    user: "1000:1000"
    read_only: true
    ports:
      - "127.0.0.1:${UPLOAD_GATEWAY_PORT:-8081}:8081"
    environment:
      UPLOAD_GATEWAY_MINIO_ENDPOINT: minio:9000
      UPLOAD_GATEWAY_MINIO_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      UPLOAD_GATEWAY_MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
      UPLOAD_GATEWAY_NATS_URL: ${NATS_URL:-nats://nats-1:4222}
      UPLOAD_GATEWAY_NATS_STREAM: ${NATS_STREAM:-INGESTION}
      UPLOAD_GATEWAY_NATS_REPLICAS: ${NATS_REPLICAS:-3}
      UPLOAD_GATEWAY_LOG_LEVEL: INFO
    tmpfs:
      - /tmp:mode=1777,size=256M
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - minio_root_user
      - minio_root_password
    depends_on:
      minio:
        condition: service_healthy
      nats-1:
        condition: service_healthy
      nats-2:
        condition: service_healthy
      nats-3:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully

  # ============================================
  # Document Parser (Python sidecar)
  # ============================================
  doc-parser:
    build:
      context: ../../services/doc-parser
      dockerfile: Dockerfile
    user: "1000:1000"
    read_only: true
    ports:
      - "127.0.0.1:${DOC_PARSER_PORT:-8080}:8080"
    environment:
      DOC_PARSER_LOG_LEVEL: INFO
      DOC_PARSER_MAX_FILE_SIZE_MB: 100
    tmpfs:
      - /tmp:mode=1777,size=512M
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ============================================
  # Ingestion Orchestrator (Rust)
  # ============================================
  ingestion:
    build:
      context: ../..
      dockerfile: deploy/compose/ingestion/Dockerfile
    user: "1000:1000"
    environment:
      NATS_URL: ${NATS_URL:-nats://nats-1:4222}
      NATS_STREAM: ${NATS_STREAM:-INGESTION}
      NATS_CONSUMER: ${NATS_CONSUMER:-ingestion-orchestrator}
      NATS_DLQ_STREAM: ${NATS_DLQ_STREAM:-akidb-dlq}
      NATS_REPLICAS: ${NATS_REPLICAS:-3}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      STORAGE_SECRET_KEY_FILE: /run/secrets/minio_root_password
      STORAGE_BUCKET: akidb-documents
      AKIDB_ENDPOINT: http://akidb-server:50051
      AKIDB_TIMEOUT_MS: ${AKIDB_TIMEOUT_MS:-30000}
      AKIDB_MAX_RETRIES: ${AKIDB_MAX_RETRIES:-3}
      DOC_PARSER_URL: http://doc-parser:8080
      EMBEDDING_URL: ${EMBEDDING_URL:-http://host.docker.internal:8000}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-4B}
      INGESTION_METRICS_ADDR: 0.0.0.0:9093
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: ${RUST_BACKTRACE:-0}
    volumes:
      - ingestion-state:/var/lib/akidb
    tmpfs:
      - /tmp:mode=1777,size=256M
    networks:
      - akidb-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - minio_root_user
      - minio_root_password
    depends_on:
      nats-1:
        condition: service_healthy
      doc-parser:
        condition: service_started
      minio:
        condition: service_healthy
      akidb-server:
        condition: service_healthy

  # ============================================
  # AkiDB Server (Vector Database Shard)
  # ============================================
  akidb-server:
    build:
      context: ../..
      dockerfile: deploy/docker/akidb-server.Dockerfile
    user: "1000:1000"
    ports:
      - "127.0.0.1:50051:50051"   # gRPC
      - "127.0.0.1:9092:9090"     # Metrics (mapped to avoid conflict with prometheus)
    environment:
      RUST_LOG: info
      AKIDB_DATA_DIR: /var/lib/akidb/data
      AKIDB_WAL_DIR: /var/lib/akidb/wal
      AKIDB_LISTEN_ADDR: 0.0.0.0:50051
      AKIDB_METRICS_ADDR: 0.0.0.0:9090
      AKIDB_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-2560}
      # The coordinator cannot propagate shard credentials yet. This exception
      # is restricted to the private Compose network and loopback host ports.
      AKIDB_AUTH_MODE: disabled
    volumes:
      - akidb-server-data:/var/lib/akidb
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ============================================
  # AkiDB Coordinator (Query Router)
  # ============================================
  akidb-coordinator:
    build:
      context: ../..
      dockerfile: deploy/docker/akidb-coordinator.Dockerfile
    user: "1000:1000"
    ports:
      - "127.0.0.1:50052:50052"   # gRPC
      - "127.0.0.1:9091:9091"     # Metrics
    environment:
      RUST_LOG: info
      AKIDB_COORDINATOR_LISTEN_ADDR: 0.0.0.0:50052
      AKIDB_COORDINATOR_METRICS_HOST: 0.0.0.0
      AKIDB_COORDINATOR_METRICS_PORT: 9091
      AKIDB_SHARD_ADDRS: akidb-server:50051
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9091/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      akidb-server:
        condition: service_healthy

  # ============================================
  # Prometheus (Monitoring)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    user: "65534:65534"  # nobody user for prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - nats-exporter

  # ============================================
  # Grafana (Dashboards)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    user: "472:472"  # grafana user
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cluster-health.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - akidb-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus

networks:
  akidb-net:
    driver: bridge

volumes:
  nats-1-data:
  nats-2-data:
  nats-3-data:
  minio-data:
  ingestion-state:
  akidb-server-data:
  prometheus-data:
  grafana-data:

# ============================================
# Secrets (ADR-021 Security Hardening)
# ============================================
secrets:
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
