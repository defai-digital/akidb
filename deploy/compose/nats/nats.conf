# NATS JetStream Configuration for AkiDB Thor Edition
# 3-node cluster with JetStream enabled

# Server identification (set via command line --name flag)
# server_name is provided via --name argument in docker-compose

# Client connections
port: 4222
http_port: 8222

# Clustering (disabled for single-node testing)
# cluster {
#   port: 6222
#   name: akidb-cluster
# }

# JetStream configuration (single-node mode)
jetstream {
  # Storage directory
  store_dir: /data/jetstream

  # Memory storage limit
  max_memory_store: 1GB

  # File storage limit
  max_file_store: 10GB
}

# Logging (stdout for container compatibility)
debug: false
trace: false
logtime: true
# log_file: "/data/nats.log"  # Disabled - logs to stdout

# Limits
max_connections: 10000
max_payload: 8MB
max_pending: 64MB

# Ping/Pong for connection health
ping_interval: "30s"
ping_max: 3

# Write deadline for slow consumers
write_deadline: "10s"

# Leaf nodes (for future expansion)
leafnodes {
  port: 7422
}

# Monitoring
# Accessible at http://localhost:8222/varz, /connz, /routez, /subsz, /jsz
