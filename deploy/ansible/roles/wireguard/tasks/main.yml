---
- name: Require WireGuard host variables
  ansible.builtin.assert:
    that:
      - akidb_overlay_address is defined
      - akidb_overlay_address | length > 0
      - akidb_overlay_cidr is defined
      - akidb_overlay_cidr | length > 0
      - ansible_host is defined
      - groups['akidb_cluster'] | length >= 2

- name: Reconcile private service-name resolution
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} AKIDB PRIVATE OVERLAY"
    block: |
      {% for host in groups['akidb_cluster'] | sort %}
      {{ hostvars[host].akidb_overlay_address }} {{ host }}
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  when: akidb_manage_overlay_hosts | bool

- name: Install WireGuard
  ansible.builtin.apt:
    name:
      - wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: akidb_manage_ufw | bool

- name: Create WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect WireGuard private key
  ansible.builtin.stat:
    path: "/etc/wireguard/{{ akidb_wireguard_interface }}.key"
  register: akidb_wireguard_key_file

- name: Generate WireGuard private key
  ansible.builtin.command:
    argv: [wg, genkey]
  register: akidb_wireguard_generated_key
  changed_when: true
  no_log: true
  when: not akidb_wireguard_key_file.stat.exists

- name: Persist WireGuard private key
  ansible.builtin.copy:
    content: "{{ akidb_wireguard_generated_key.stdout }}\n"
    dest: "/etc/wireguard/{{ akidb_wireguard_interface }}.key"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not akidb_wireguard_key_file.stat.exists

- name: Read WireGuard private key
  ansible.builtin.slurp:
    path: "/etc/wireguard/{{ akidb_wireguard_interface }}.key"
  register: akidb_wireguard_key_slurp
  no_log: true

- name: Keep WireGuard private key in memory
  ansible.builtin.set_fact:
    akidb_wireguard_private_key: "{{ akidb_wireguard_key_slurp.content | b64decode | trim }}"
  no_log: true

- name: Derive WireGuard public key
  ansible.builtin.command:
    argv: [wg, pubkey]
    stdin: "{{ akidb_wireguard_private_key }}"
  register: akidb_wireguard_public_key_result
  changed_when: false
  no_log: true

- name: Publish WireGuard public key to peer hostvars
  ansible.builtin.set_fact:
    akidb_wireguard_public_key: "{{ akidb_wireguard_public_key_result.stdout | trim }}"

- name: Allow SSH before enabling UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - "{{ akidb_ssh_port | string }}/tcp"
      - comment
      - AkiDB administration
  register: akidb_ufw_ssh_rule
  changed_when: "'Rule added' in akidb_ufw_ssh_rule.stdout"
  when: akidb_manage_ufw | bool

- name: Read firewall policy before reconciliation
  ansible.builtin.command:
    argv: [ufw, status, verbose]
  changed_when: false
  register: akidb_ufw_status_before
  when: akidb_manage_ufw | bool

- name: Set default incoming firewall policy
  ansible.builtin.command:
    argv: [ufw, default, deny, incoming]
  register: akidb_ufw_default_incoming
  changed_when: true
  when:
    - akidb_manage_ufw | bool
    - "'Default: deny (incoming)' not in akidb_ufw_status_before.stdout"

- name: Set default outgoing firewall policy
  ansible.builtin.command:
    argv: [ufw, default, allow, outgoing]
  register: akidb_ufw_default_outgoing
  changed_when: true
  when:
    - akidb_manage_ufw | bool
    - "'allow (outgoing)' not in akidb_ufw_status_before.stdout"

- name: Allow WireGuard only from declared peers
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - proto
      - udp
      - from
      - "{{ hostvars[item].ansible_host }}"
      - to
      - any
      - port
      - "{{ akidb_wireguard_port | string }}"
      - comment
      - "AkiDB WireGuard {{ item }}"
  loop: "{{ groups['akidb_cluster'] | difference([inventory_hostname]) }}"
  register: akidb_ufw_rule
  changed_when: "'Rule added' in akidb_ufw_rule.stdout"
  when: akidb_manage_ufw | bool

- name: Render full-mesh WireGuard configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "/etc/wireguard/{{ akidb_wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart AkiDB WireGuard

- name: Enable and start WireGuard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ akidb_wireguard_interface }}"
    enabled: true
    state: started

- name: Apply pending WireGuard changes
  ansible.builtin.meta: flush_handlers

- name: Allow shard traffic only through the trusted overlay
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - "{{ akidb_wireguard_interface }}"
      - from
      - "{{ akidb_overlay_cidr }}"
      - to
      - any
      - port
      - "{{ akidb_server_port | string }}"
      - proto
      - tcp
      - comment
      - AkiDB shard overlay
  register: akidb_ufw_shard_rule
  changed_when: "'Rule added' in akidb_ufw_shard_rule.stdout"
  when:
    - akidb_manage_ufw | bool
    - inventory_hostname in groups.get('akidb_shards', [])

- name: Allow coordinator traffic only through the trusted overlay
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - "{{ akidb_wireguard_interface }}"
      - from
      - "{{ akidb_overlay_cidr }}"
      - to
      - any
      - port
      - "{{ akidb_coordinator_port | string }}"
      - proto
      - tcp
      - comment
      - AkiDB coordinator overlay
  register: akidb_ufw_coordinator_rule
  changed_when: "'Rule added' in akidb_ufw_coordinator_rule.stdout"
  when:
    - akidb_manage_ufw | bool
    - inventory_hostname in groups.get('akidb_coordinators', [])

- name: Allow immutable knowledge-replica traffic through the overlay
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - "{{ akidb_wireguard_interface }}"
      - from
      - "{{ akidb_overlay_cidr }}"
      - to
      - any
      - port
      - "{{ akidb_knowledge_server_port | string }}"
      - proto
      - tcp
      - comment
      - AkiDB knowledge replica overlay
  register: akidb_ufw_knowledge_replica_rule
  changed_when: "'Rule added' in akidb_ufw_knowledge_replica_rule.stdout"
  when:
    - akidb_manage_ufw | bool
    - inventory_hostname in groups.get('akidb_knowledge_replicas', [])

- name: Allow knowledge-replica Prometheus traffic through the overlay
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - "{{ akidb_wireguard_interface }}"
      - from
      - "{{ akidb_overlay_cidr }}"
      - to
      - any
      - port
      - "{{ akidb_knowledge_metrics_port | string }}"
      - proto
      - tcp
      - comment
      - AkiDB knowledge metrics overlay
  register: akidb_ufw_knowledge_metrics_rule
  changed_when: "'Rule added' in akidb_ufw_knowledge_metrics_rule.stdout"
  when:
    - akidb_manage_ufw | bool
    - inventory_hostname in groups.get('akidb_knowledge_replicas', [])

- name: Allow AX knowledge-gateway traffic through the overlay
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - "{{ akidb_wireguard_interface }}"
      - from
      - "{{ akidb_overlay_cidr }}"
      - to
      - any
      - port
      - "{{ akidb_knowledge_gateway_port | string }}"
      - proto
      - tcp
      - comment
      - AX knowledge gateway overlay
  register: akidb_ufw_knowledge_gateway_rule
  changed_when: "'Rule added' in akidb_ufw_knowledge_gateway_rule.stdout"
  when:
    - akidb_manage_ufw | bool
    - inventory_hostname in groups.get('ax_knowledge_gateways', [])

- name: Allow knowledge-control PostgreSQL through the overlay
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - "{{ akidb_wireguard_interface }}"
      - from
      - "{{ akidb_overlay_cidr }}"
      - to
      - any
      - port
      - "{{ akidb_knowledge_postgres_port | string }}"
      - proto
      - tcp
      - comment
      - AX knowledge PostgreSQL overlay
  register: akidb_ufw_knowledge_postgres_rule
  changed_when: "'Rule added' in akidb_ufw_knowledge_postgres_rule.stdout"
  when:
    - akidb_manage_ufw | bool
    - inventory_hostname in groups.get('akidb_knowledge_dependencies', [])

- name: Allow knowledge MinIO through the overlay
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - "on"
      - "{{ akidb_wireguard_interface }}"
      - from
      - "{{ akidb_overlay_cidr }}"
      - to
      - any
      - port
      - "{{ akidb_knowledge_minio_port | string }}"
      - proto
      - tcp
      - comment
      - AkiDB knowledge MinIO overlay
  register: akidb_ufw_knowledge_minio_rule
  changed_when: "'Rule added' in akidb_ufw_knowledge_minio_rule.stdout"
  when:
    - akidb_manage_ufw | bool
    - inventory_hostname in groups.get('akidb_knowledge_dependencies', [])

- name: Enable UFW after administration and overlay rules exist
  ansible.builtin.command:
    argv: [ufw, --force, enable]
  register: akidb_ufw_enable
  changed_when: true
  when:
    - akidb_manage_ufw | bool
    - "'Status: active' not in akidb_ufw_status_before.stdout"

- name: Require an active firewall
  ansible.builtin.command:
    argv: [ufw, status]
  changed_when: false
  register: akidb_ufw_status
  failed_when: "'Status: active' not in akidb_ufw_status.stdout"
  when: akidb_manage_ufw | bool

- name: Wait for every overlay peer
  ansible.builtin.command:
    argv:
      - ping
      - -c
      - "1"
      - -W
      - "2"
      - "{{ hostvars[item].akidb_overlay_address }}"
  loop: "{{ groups['akidb_cluster'] | difference([inventory_hostname]) }}"
  changed_when: false
  register: akidb_overlay_ping
  retries: 5
  delay: 2
  until: akidb_overlay_ping.rc == 0
