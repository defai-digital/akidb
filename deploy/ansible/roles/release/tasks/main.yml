---
- name: Inspect installed immutable-release marker
  ansible.builtin.stat:
    path: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}/.artifact.sha256"
  register: akidb_release_marker

- name: Read installed immutable-release marker
  ansible.builtin.slurp:
    path: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}/.artifact.sha256"
  register: akidb_release_marker_content
  when: akidb_release_marker.stat.exists

- name: Reject a reused release id with different content
  ansible.builtin.assert:
    that:
      - (akidb_release_marker_content.content | b64decode | trim) == akidb_artifact_sha256
    fail_msg: >-
      Release {{ akidb_release_id }} already exists with a different checksum;
      immutable release ids cannot be overwritten.
  when: akidb_release_marker.stat.exists

- name: Create versioned release directory
  ansible.builtin.file:
    path: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not akidb_release_marker.stat.exists

- name: Upload checksum-pinned release artifact
  ansible.builtin.copy:
    src: "{{ akidb_artifact_path }}"
    dest: "{{ akidb_install_root }}/.artifacts/akidb-{{ akidb_release_id }}.tar.gz"
    owner: root
    group: root
    mode: "0644"
  when: not akidb_release_marker.stat.exists

- name: Verify uploaded artifact checksum
  ansible.builtin.stat:
    path: "{{ akidb_install_root }}/.artifacts/akidb-{{ akidb_release_id }}.tar.gz"
    checksum_algorithm: sha256
  register: akidb_remote_artifact
  when: not akidb_release_marker.stat.exists

- name: Require uploaded artifact checksum match
  ansible.builtin.assert:
    that:
      - akidb_remote_artifact.stat.checksum == akidb_artifact_sha256 | lower
    fail_msg: "Uploaded artifact SHA-256 does not match the CI checksum."
  when: not akidb_release_marker.stat.exists

- name: Expand immutable release artifact
  ansible.builtin.unarchive:
    src: "{{ akidb_install_root }}/.artifacts/akidb-{{ akidb_release_id }}.tar.gz"
    dest: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}"
    remote_src: true
    owner: root
    group: root
  when: not akidb_release_marker.stat.exists

- name: Enforce traversable immutable release directory
  ansible.builtin.file:
    path: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Inspect required release binaries
  ansible.builtin.stat:
    path: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}/bin/{{ item }}"
  loop:
    - akidb
    - akidb-server
    - akidb-coordinator
    - akidb-bench
  register: akidb_release_binaries

- name: Require executable release binaries
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.executable
    quiet: true
  loop: "{{ akidb_release_binaries.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Seal immutable release with artifact checksum
  ansible.builtin.copy:
    content: "{{ akidb_artifact_sha256 }}\n"
    dest: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}/.artifact.sha256"
    owner: root
    group: root
    mode: "0444"
  when: not akidb_release_marker.stat.exists
