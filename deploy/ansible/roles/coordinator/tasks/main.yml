---
- name: Activate immutable release
  ansible.builtin.file:
    src: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}"
    dest: "{{ akidb_install_root }}/current"
    state: link
    force: true
  notify: Restart AkiDB coordinator

- name: Install coordinator systemd unit
  ansible.builtin.template:
    src: akidb-coordinator.service.j2
    dest: /etc/systemd/system/akidb-coordinator.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart AkiDB coordinator

- name: Start coordinator service
  ansible.builtin.systemd_service:
    name: akidb-coordinator
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending coordinator restart
  ansible.builtin.meta: flush_handlers

- name: Gate coordinator rollout on gRPC readiness
  ansible.builtin.command:
    argv:
      - "{{ akidb_install_root }}/current/bin/akidb"
      - health
      - --server
      - "{{ akidb_overlay_address }}:{{ akidb_coordinator_port }}"
      - --require-ready
  changed_when: false
  register: akidb_coordinator_rollout_health
  retries: 15
  delay: 2
  until: akidb_coordinator_rollout_health.rc == 0
