---
- name: Require pinned dependency artifacts and credentials
  ansible.builtin.assert:
    that:
      - akidb_knowledge_seaweedfs_tag | length > 0
      - akidb_knowledge_seaweedfs_url | length > 0
      # Upstream publishes only .md5 for release assets, so the operator must
      # supply and the role must verify a SHA256 for the release archive.
      - akidb_knowledge_seaweedfs_sha256 is match('^[a-fA-F0-9]{64}$')
      - akidb_knowledge_seaweedfs_bucket | length > 0
      - akidb_knowledge_seaweedfs_volume_size_limit_mb | int > 0
      - akidb_knowledge_postgres_password | length >= 24
      - akidb_knowledge_seaweedfs_root_access_key | length >= 3
      - akidb_knowledge_seaweedfs_root_secret_key | length >= 24
      - akidb_knowledge_seaweedfs_access_key | length >= 3
      - akidb_knowledge_seaweedfs_secret_key | length >= 24
      - ax_knowledge_seaweedfs_publish_access_key | length >= 3
      - ax_knowledge_seaweedfs_publish_secret_key | length >= 24
  no_log: true

- name: Install PostgreSQL and control dependencies
  ansible.builtin.apt:
    name:
      - postgresql
      - python3-psycopg2
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install knowledge-cell CA into the host trust store
  ansible.builtin.copy:
    src: "{{ akidb_knowledge_pki_dir }}/ca.crt"
    dest: /usr/local/share/ca-certificates/akidb-knowledge-cell.crt
    owner: root
    group: root
    mode: "0644"
  register: knowledge_dependency_system_ca

- name: Refresh dependency-host CA trust
  ansible.builtin.command:
    argv: [update-ca-certificates]
  changed_when: true
  when: knowledge_dependency_system_ca.changed

- name: Create protected PostgreSQL TLS directory
  ansible.builtin.file:
    path: /etc/postgresql/knowledge-tls
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Install PostgreSQL TLS certificate
  ansible.builtin.copy:
    src: "{{ akidb_knowledge_pki_dir }}/hosts/{{ inventory_hostname }}.crt"
    dest: /etc/postgresql/knowledge-tls/server.crt
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart knowledge PostgreSQL

- name: Install PostgreSQL TLS private key
  ansible.builtin.copy:
    src: "{{ akidb_knowledge_pki_dir }}/hosts/{{ inventory_hostname }}.key"
    dest: /etc/postgresql/knowledge-tls/server.key
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true
  notify: Restart knowledge PostgreSQL

- name: Locate active PostgreSQL configuration
  ansible.builtin.command:
    argv: [sudo, -u, postgres, psql, -Atqc, show config_file]
  changed_when: false
  register: knowledge_postgres_config_path

- name: Locate active PostgreSQL client policy
  ansible.builtin.command:
    argv: [sudo, -u, postgres, psql, -Atqc, show hba_file]
  changed_when: false
  register: knowledge_postgres_hba_path

- name: Reconcile PostgreSQL knowledge-cell settings
  ansible.builtin.lineinfile:
    path: "{{ knowledge_postgres_config_path.stdout | trim }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - regexp: "^#?listen_addresses\\s*="
      line: "listen_addresses = '{{ akidb_overlay_address }}'"
    - regexp: "^#?ssl\\s*="
      line: "ssl = on"
    - regexp: "^#?ssl_cert_file\\s*="
      line: "ssl_cert_file = '/etc/postgresql/knowledge-tls/server.crt'"
    - regexp: "^#?ssl_key_file\\s*="
      line: "ssl_key_file = '/etc/postgresql/knowledge-tls/server.key'"
    - regexp: "^#?ssl_min_protocol_version\\s*="
      line: "ssl_min_protocol_version = 'TLSv1.2'"
    - regexp: "^#?password_encryption\\s*="
      line: "password_encryption = 'scram-sha-256'"
  notify: Restart knowledge PostgreSQL

- name: Permit only TLS knowledge-control connections on the overlay
  community.postgresql.postgresql_pg_hba:
    dest: "{{ knowledge_postgres_hba_path.stdout | trim }}"
    contype: hostssl
    databases: "{{ akidb_knowledge_postgres_database }}"
    users: "{{ akidb_knowledge_postgres_user }}"
    source: "{{ akidb_overlay_cidr }}"
    method: scram-sha-256
    create: true
  notify: Restart knowledge PostgreSQL

- name: Apply pending PostgreSQL restart
  ansible.builtin.meta: flush_handlers

- name: Create least-privilege knowledge-control PostgreSQL role
  community.postgresql.postgresql_user:
    name: "{{ akidb_knowledge_postgres_user }}"
    password: "{{ akidb_knowledge_postgres_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOINHERIT,LOGIN
    state: present
    login_unix_socket: /var/run/postgresql
  become_user: postgres
  no_log: true

- name: Create knowledge-control database
  community.postgresql.postgresql_db:
    name: "{{ akidb_knowledge_postgres_database }}"
    owner: "{{ akidb_knowledge_postgres_user }}"
    encoding: UTF-8
    state: present
    login_unix_socket: /var/run/postgresql
  become_user: postgres

- name: Create SeaweedFS service group
  ansible.builtin.group:
    name: seaweedfs
    system: true
    state: present

- name: Create SeaweedFS service user
  ansible.builtin.user:
    name: seaweedfs
    group: seaweedfs
    home: /var/lib/seaweedfs
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create SeaweedFS data and TLS directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: /var/lib/seaweedfs/knowledge
      owner: seaweedfs
      group: seaweedfs
      mode: "0750"
    - path: /etc/seaweedfs
      owner: root
      group: seaweedfs
      mode: "0750"
    - path: /etc/seaweedfs/certs
      owner: root
      group: seaweedfs
      mode: "0750"
    - path: /etc/seaweedfs/certs/CAs
      owner: root
      group: seaweedfs
      mode: "0750"

- name: Download the checksum-pinned SeaweedFS release archive
  ansible.builtin.get_url:
    url: "{{ akidb_knowledge_seaweedfs_url }}"
    dest: "/var/tmp/seaweedfs-{{ akidb_knowledge_seaweedfs_tag }}.tar.gz"
    checksum: "sha256:{{ akidb_knowledge_seaweedfs_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Extract the pinned SeaweedFS release archive
  ansible.builtin.unarchive:
    src: "/var/tmp/seaweedfs-{{ akidb_knowledge_seaweedfs_tag }}.tar.gz"
    dest: "/var/tmp/seaweedfs-{{ akidb_knowledge_seaweedfs_tag }}"
    remote_src: true
    owner: root
    group: root
    creates: "/var/tmp/seaweedfs-{{ akidb_knowledge_seaweedfs_tag }}/weed"

- name: Install the verified weed binary
  ansible.builtin.copy:
    src: "/var/tmp/seaweedfs-{{ akidb_knowledge_seaweedfs_tag }}/weed"
    dest: /usr/local/bin/weed
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart knowledge SeaweedFS

- name: Install SeaweedFS TLS materials
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: seaweedfs
    mode: "{{ item.mode }}"
  loop:
    - src: "{{ akidb_knowledge_pki_dir }}/ca.crt"
      dest: /etc/seaweedfs/certs/CAs/ca.crt
      mode: "0644"
    - src: "{{ akidb_knowledge_pki_dir }}/hosts/{{ inventory_hostname }}.crt"
      dest: /etc/seaweedfs/certs/server.crt
      mode: "0644"
    - src: "{{ akidb_knowledge_pki_dir }}/hosts/{{ inventory_hostname }}.key"
      dest: /etc/seaweedfs/certs/server.key
      mode: "0640"
  no_log: true
  notify: Restart knowledge SeaweedFS

- name: Install protected SeaweedFS S3 gateway identities
  ansible.builtin.template:
    src: s3.json.j2
    dest: /etc/seaweedfs/s3.json
    owner: root
    group: seaweedfs
    mode: "0640"
  no_log: true
  notify: Reload knowledge SeaweedFS S3 credentials

- name: Install SeaweedFS systemd unit
  ansible.builtin.template:
    src: seaweedfs-knowledge.service.j2
    dest: /etc/systemd/system/seaweedfs-knowledge.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart knowledge SeaweedFS

- name: Start SeaweedFS
  ansible.builtin.systemd_service:
    name: seaweedfs-knowledge
    state: started
    enabled: true
    daemon_reload: true

- name: Apply pending SeaweedFS restart
  ansible.builtin.meta: flush_handlers

- name: Wait for SeaweedFS master health
  ansible.builtin.uri:
    url: "http://{{ akidb_overlay_address }}:{{ akidb_knowledge_seaweedfs_master_port }}/cluster/healthz"
    status_code: 200
  register: knowledge_seaweedfs_master_health
  retries: 20
  delay: 2
  until: knowledge_seaweedfs_master_health.status == 200

- name: Wait for SeaweedFS S3 TLS liveness
  ansible.builtin.uri:
    url: "https://{{ akidb_overlay_address }}:{{ akidb_knowledge_seaweedfs_port }}/healthz"
    ca_path: /etc/seaweedfs/certs/CAs/ca.crt
    status_code: 200
  register: knowledge_seaweedfs_s3_liveness
  retries: 20
  delay: 2
  until: knowledge_seaweedfs_s3_liveness.status == 200

# `cluster.check` is a coarse reachability and disk-type allowance check, not a
# writability gate. Measured on SeaweedFS 4.47: a cluster whose volumes were all
# full (volume.list reported hdd(volume:5/5 active:5 free:0)) still exited 0 and
# printed only benign per-hop ping lines, including
# `unknown ping target localhost:9333 of type master`. The command only fails
# when a disk type has no volume allowance at all (no disk types reported, or
# MaxVolumeCount == 0). Real write capacity is verified by the S3 write probe
# below, not by this task.
- name: Check SeaweedFS cluster reachability and disk-type allowance
  ansible.builtin.command:
    argv:
      - /usr/local/bin/weed
      - shell
      - "-master={{ akidb_overlay_address }}:{{ akidb_knowledge_seaweedfs_master_port }}"
    stdin: "cluster.check\n"
  register: knowledge_seaweedfs_cluster_check
  changed_when: false

- name: Install the pinned S3 client
  ansible.builtin.include_tasks: s3_client.yml

- name: Read the existing SeaweedFS buckets
  ansible.builtin.command:
    argv:
      - /usr/local/bin/weed
      - shell
      - "-master={{ akidb_overlay_address }}:{{ akidb_knowledge_seaweedfs_master_port }}"
    stdin: "s3.bucket.list\n"
  register: knowledge_seaweedfs_bucket_list
  changed_when: false

# s3.bucket.list prints one "  <bucket>\tsize:...\t..." line per bucket, so the
# bucket name is the first tab-separated field after trimming the indent.
- name: Resolve the existing SeaweedFS bucket names
  ansible.builtin.set_fact:
    knowledge_seaweedfs_existing_buckets: >-
      {{
        knowledge_seaweedfs_bucket_list.stdout_lines
        | map('trim')
        | map('regex_replace', '\t.*$', '')
        | list
      }}

- name: Create the immutable-generation bucket
  ansible.builtin.command:
    argv:
      - /usr/local/bin/weed
      - shell
      - "-master={{ akidb_overlay_address }}:{{ akidb_knowledge_seaweedfs_master_port }}"
    stdin: "s3.bucket.create -name {{ akidb_knowledge_seaweedfs_bucket }}\n"
  register: knowledge_seaweedfs_bucket_create
  # `weed shell` only reports the status of the last piped command, so exactly
  # one command is piped per invocation. The bucket is listed first and created
  # only when absent, because on the pinned 4.47 release `s3.bucket.create` is
  # not idempotent: creating an existing bucket still exits 0 and prints
  # "created bucket <name>", so a create-on-every-run task would report a change
  # every run. The "already exists" tolerance stays for releases that do surface
  # the error path (weed/shell/command_s3_bucket_create.go returns
  # "bucket <name> already exists" when the filer reports ErrEntryAlreadyExists).
  when: akidb_knowledge_seaweedfs_bucket not in knowledge_seaweedfs_existing_buckets
  changed_when: true
  failed_when: >-
    knowledge_seaweedfs_bucket_create.rc != 0
    and 'already exists' not in knowledge_seaweedfs_bucket_create.stderr

- name: Report the immutable-generation bucket state
  ansible.builtin.debug:
    msg: >-
      {{ akidb_knowledge_seaweedfs_bucket }}:
      {{ 'already present, no create issued'
         if knowledge_seaweedfs_bucket_create.skipped | default(false)
         else ('create reported success'
               if 'created bucket' in knowledge_seaweedfs_bucket_create.stdout | default('')
               else ('create reported that the bucket already exists'
                     if 'already exists' in knowledge_seaweedfs_bucket_create.stderr | default('')
                     else 'create output was not recognised')) }}

- name: Create a bounded S3 write probe object
  ansible.builtin.copy:
    content: "akidb seaweedfs write probe\n"
    dest: /var/tmp/akidb-write-probe
    owner: root
    group: root
    mode: "0600"

# The only end-to-end proof that this deployment can publish: it goes through
# the S3 gateway over TLS, with the same publish identity AX Fabric uses. A
# bucket whose volumes are exhausted accepts no write even though every health
# endpoint above still answers 200.
- name: Require the publish identity to write through the S3 gateway
  ansible.builtin.command:
    argv:
      - "{{ akidb_awscli_bin_dir }}/aws"
      - --endpoint-url
      - "https://{{ akidb_overlay_address }}:{{ akidb_knowledge_seaweedfs_port }}"
      - s3
      - cp
      - /var/tmp/akidb-write-probe
      - "s3://{{ akidb_knowledge_seaweedfs_bucket }}/.akidb-write-probe"
      - --no-progress
  environment:
    AWS_ACCESS_KEY_ID: "{{ ax_knowledge_seaweedfs_publish_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ ax_knowledge_seaweedfs_publish_secret_key }}"
    AWS_DEFAULT_REGION: us-east-1
    AWS_CA_BUNDLE: /etc/seaweedfs/certs/CAs/ca.crt
  changed_when: false
  no_log: true

- name: Remove the S3 write probe object
  ansible.builtin.command:
    argv:
      - "{{ akidb_awscli_bin_dir }}/aws"
      - --endpoint-url
      - "https://{{ akidb_overlay_address }}:{{ akidb_knowledge_seaweedfs_port }}"
      - s3
      - rm
      - "s3://{{ akidb_knowledge_seaweedfs_bucket }}/.akidb-write-probe"
      # `aws s3 rm` has no --no-progress flag (only cp/sync/mv do); this is the
      # smallest-output option it does accept, and it still prints errors.
      - --only-show-errors
  environment:
    AWS_ACCESS_KEY_ID: "{{ ax_knowledge_seaweedfs_publish_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ ax_knowledge_seaweedfs_publish_secret_key }}"
    AWS_DEFAULT_REGION: us-east-1
    AWS_CA_BUNDLE: /etc/seaweedfs/certs/CAs/ca.crt
  changed_when: false
  no_log: true

- name: Report the verified object-store outcome
  ansible.builtin.debug:
    msg: >-
      {{ akidb_knowledge_seaweedfs_bucket }} is writable over
      https://{{ akidb_overlay_address }}:{{ akidb_knowledge_seaweedfs_port }}
      with the publish identity: a probe object was written and removed.
      Probed object keys are cleaned up on success; a failure between the write
      and the removal leaves .akidb-write-probe in the bucket, which the next
      role run removes and a canonical backup would include.
