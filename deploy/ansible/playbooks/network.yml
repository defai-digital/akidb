---
- name: Build the private AkiDB service network
  hosts: akidb_cluster
  become: true
  gather_facts: true
  any_errors_fatal: true
  roles:
    # Dual-mode: private backplane when available, WireGuard otherwise.
    # Controlled by akidb_service_network_mode (wireguard|private).
    - role: service_network
