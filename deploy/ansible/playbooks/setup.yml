---
# Setup AkiDB Prerequisites
# Usage: ansible-playbook -i inventory.yml playbooks/setup.yml

- name: Setup AkiDB Prerequisites
  hosts: thor_cluster
  become: yes
  gather_facts: yes

  vars:
    rust_version: "stable"

  tasks:
    # Create directories
    - name: Create AkiDB directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - "{{ akidb_install_dir }}"
        - "{{ akidb_install_dir }}/bin"
        - "{{ akidb_install_dir }}/config"
        - "{{ akidb_install_dir }}/logs"
        - "{{ akidb_data_dir }}"
        - "{{ akidb_data_dir }}/rocksdb"
        - "{{ akidb_data_dir }}/wal"
        - "{{ akidb_data_dir }}/minio"

    # Install system dependencies
    - name: Install system dependencies
      apt:
        name:
          - build-essential
          - pkg-config
          - libssl-dev
          - libclang-dev
          - cmake
          - git
          - curl
          - wget
          - htop
          - iotop
        state: present
        update_cache: yes

    # Install Rust (if not present)
    - name: Check if Rust is installed
      command: rustc --version
      register: rust_check
      changed_when: false
      ignore_errors: yes
      become: no

    - name: Download Rust installer
      get_url:
        url: https://sh.rustup.rs
        dest: /tmp/rustup.sh
        mode: '0755'
      when: rust_check.rc != 0
      become: no

    - name: Install Rust
      shell: /tmp/rustup.sh -y --default-toolchain {{ rust_version }}
      when: rust_check.rc != 0
      become: no

    - name: Add Rust to PATH
      lineinfile:
        path: "/home/{{ ansible_user }}/.bashrc"
        line: 'export PATH="$HOME/.cargo/bin:$PATH"'
        create: yes
      become: no

    # Install MinIO
    - name: Check if MinIO is installed
      stat:
        path: /usr/local/bin/minio
      register: minio_stat

    - name: Download MinIO
      get_url:
        url: https://dl.min.io/server/minio/release/linux-arm64/minio
        dest: /usr/local/bin/minio
        mode: '0755'
      when: not minio_stat.stat.exists

    - name: Download MinIO client
      get_url:
        url: https://dl.min.io/client/mc/release/linux-arm64/mc
        dest: /usr/local/bin/mc
        mode: '0755'
      when: not minio_stat.stat.exists

    # Create MinIO systemd service
    - name: Create MinIO service file
      template:
        src: ../templates/minio.service.j2
        dest: /etc/systemd/system/minio.service
        mode: '0644'
      notify: Reload systemd

    # Create AkiDB systemd service
    - name: Create AkiDB service file
      template:
        src: ../templates/akidb.service.j2
        dest: /etc/systemd/system/akidb.service
        mode: '0644'
      notify: Reload systemd

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes
