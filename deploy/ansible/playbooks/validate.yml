---
# Validate Thor Hardware
# Usage: ansible-playbook -i inventory.yml playbooks/validate.yml

- name: Validate Thor Hardware
  hosts: thor_cluster
  become: yes
  gather_facts: yes

  tasks:
    - name: Display system info
      debug:
        msg: |
          Hostname: {{ ansible_hostname }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Kernel: {{ ansible_kernel }}
          Architecture: {{ ansible_architecture }}
          Memory: {{ ansible_memtotal_mb }}MB
          CPUs: {{ ansible_processor_vcpus }}

    - name: Check if ARM64
      assert:
        that: ansible_architecture == "aarch64"
        fail_msg: "This playbook is for ARM64 (Jetson Thor) only"
        success_msg: "Architecture: aarch64 confirmed"

    - name: Check NVIDIA driver
      command: nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader
      register: nvidia_smi
      changed_when: false
      ignore_errors: yes

    - name: Display GPU info
      debug:
        msg: "{{ nvidia_smi.stdout }}"
      when: nvidia_smi.rc == 0

    - name: Fail if no GPU
      fail:
        msg: "NVIDIA GPU not detected. Install NVIDIA drivers."
      when: nvidia_smi.rc != 0

    - name: Check CUDA version
      shell: nvcc --version | grep release | awk '{print $5}' | tr -d ','
      register: cuda_version
      changed_when: false
      ignore_errors: yes

    - name: Display CUDA version
      debug:
        msg: "CUDA Version: {{ cuda_version.stdout }}"
      when: cuda_version.rc == 0

    - name: Check available disk space
      shell: df -BG / | awk 'NR==2 {print $4}' | tr -d 'G'
      register: disk_free
      changed_when: false

    - name: Display disk space
      debug:
        msg: "Free disk space: {{ disk_free.stdout }}GB"

    - name: Warn if low disk space
      debug:
        msg: "WARNING: Less than 50GB free disk space"
      when: disk_free.stdout | int < 50

    - name: Check memory
      assert:
        that: ansible_memtotal_mb >= 16000
        fail_msg: "Insufficient memory. Minimum 16GB required."
        success_msg: "Memory: {{ ansible_memtotal_mb }}MB - OK"

    - name: Check Python3
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Display Python version
      debug:
        msg: "{{ python_version.stdout }}"

    - name: Check if Rust is installed
      command: rustc --version
      register: rust_version
      changed_when: false
      ignore_errors: yes

    - name: Display Rust version (if installed)
      debug:
        msg: "{{ rust_version.stdout }}"
      when: rust_version.rc == 0

    - name: Rust not installed warning
      debug:
        msg: "Rust not installed. Will be installed during deployment."
      when: rust_version.rc != 0

    - name: Summary
      debug:
        msg: |
          ============================================
          VALIDATION SUMMARY FOR {{ ansible_hostname }}
          ============================================
          GPU: {{ 'OK' if nvidia_smi.rc == 0 else 'MISSING' }}
          CUDA: {{ cuda_version.stdout if cuda_version.rc == 0 else 'NOT FOUND' }}
          Memory: {{ ansible_memtotal_mb }}MB
          Disk Free: {{ disk_free.stdout }}GB
          Python: {{ python_version.stdout }}
          Rust: {{ rust_version.stdout if rust_version.rc == 0 else 'NOT INSTALLED' }}
          ============================================
