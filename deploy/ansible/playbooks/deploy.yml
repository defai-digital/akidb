---
# Deploy AkiDB Binaries
# Usage: ansible-playbook -i inventory.yml playbooks/deploy.yml

- name: Deploy AkiDB
  hosts: thor_cluster
  become: yes
  gather_facts: yes

  vars:
    local_binary_dir: "../../../target/aarch64-unknown-linux-gnu/release"

  tasks:
    - name: Check if binaries exist locally
      local_action:
        module: stat
        path: "{{ local_binary_dir }}/akidb-server"
      register: binary_check
      run_once: true
      become: no

    - name: Fail if binaries not built
      fail:
        msg: |
          Binaries not found. Build first with:
          cross build --release --target aarch64-unknown-linux-gnu --features cpu
      when: not binary_check.stat.exists
      run_once: true

    # Stop services before deploy
    - name: Stop AkiDB service
      systemd:
        name: akidb
        state: stopped
      ignore_errors: yes

    # Deploy binaries
    - name: Copy AkiDB server binary
      copy:
        src: "{{ local_binary_dir }}/akidb-server"
        dest: "{{ akidb_install_dir }}/bin/akidb-server"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      when: binary_check.stat.exists

    # Deploy configuration
    - name: Deploy configuration
      template:
        src: ../templates/akidb.toml.j2
        dest: "{{ akidb_install_dir }}/config/akidb.toml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    # Start services
    - name: Enable and start MinIO
      systemd:
        name: minio
        state: started
        enabled: yes

    - name: Wait for MinIO to be ready
      wait_for:
        port: 9000
        delay: 5
        timeout: 60

    - name: Create MinIO bucket
      shell: |
        mc alias set local http://localhost:9000 akidb-admin akidb-secret-key
        mc mb local/{{ minio_bucket }} --ignore-existing
      become: no
      ignore_errors: yes

    - name: Enable and start AkiDB
      systemd:
        name: akidb
        state: started
        enabled: yes

    - name: Wait for AkiDB to be ready
      wait_for:
        port: "{{ grpc_port }}"
        delay: 5
        timeout: 60

    - name: Verify deployment
      debug:
        msg: |
          ============================================
          DEPLOYMENT COMPLETE FOR {{ ansible_hostname }}
          ============================================
          AkiDB Server: http://{{ ansible_host }}:8080
          AkiDB gRPC: {{ ansible_host }}:{{ grpc_port }}
          MinIO: http://{{ ansible_host }}:9000
          Shard ID: {{ shard_id }}
          Is Coordinator: {{ is_coordinator }}
          ============================================
