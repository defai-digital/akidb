---
- name: Validate the expected immutable release
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require an explicit release id
      ansible.builtin.assert:
        that:
          - akidb_release_id | length >= 7
          - akidb_release_id | length <= 64
          - akidb_release_id is match('^[A-Za-z0-9._-]+$')
          - akidb_artifact_sha256 is match('^[a-fA-F0-9]{64}$')
        fail_msg: >-
          Set AKIDB_RELEASE_ID and AKIDB_ARTIFACT_SHA256 for the immutable
          release that every cluster process must be running.

- name: Verify the expected release artifact on every cluster host
  hosts: akidb_cluster
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Inspect the installed artifact marker
      ansible.builtin.stat:
        path: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}/.artifact.sha256"
      register: akidb_verify_release_marker

    - name: Require the expected release artifact
      ansible.builtin.assert:
        that:
          - akidb_verify_release_marker.stat.exists
          - akidb_verify_release_marker.stat.isreg
        fail_msg: >-
          {{ inventory_hostname }} does not have immutable release
          {{ akidb_release_id }} installed.

    - name: Read the installed artifact marker
      ansible.builtin.slurp:
        path: "{{ akidb_install_root }}/releases/{{ akidb_release_id }}/.artifact.sha256"
      register: akidb_verify_release_marker_content

    - name: Require the expected artifact checksum
      ansible.builtin.assert:
        that:
          - >-
            akidb_verify_release_marker_content.content | b64decode | trim ==
            akidb_artifact_sha256 | lower
        fail_msg: >-
          {{ inventory_hostname }} does not have the expected immutable
          artifact {{ akidb_release_id }} ({{ akidb_artifact_sha256 }}).

- name: Verify every shard locally
  hosts: akidb_shards
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check shard gRPC readiness
      ansible.builtin.command:
        argv:
          - "{{ akidb_install_root }}/current/bin/akidb"
          - health
          - --server
          - "{{ akidb_overlay_address }}:{{ akidb_server_port }}"
          - --require-ready
      environment:
        AKIDB_AUTH_TOKEN_FILE: "{{ akidb_config_root }}/auth.token"
      changed_when: false
      register: akidb_shard_health
      retries: 10
      delay: 2
      until: akidb_shard_health.rc == 0

    - name: Read listening TCP sockets
      ansible.builtin.command:
        argv: [ss, -H, -lnt]
      changed_when: false
      register: akidb_listening_sockets

    - name: Ensure the shard is not bound to every public interface
      ansible.builtin.assert:
        that:
          - "'0.0.0.0:' ~ (akidb_server_port | string) not in akidb_listening_sockets.stdout"
          - "'[::]:' ~ (akidb_server_port | string) not in akidb_listening_sockets.stdout"

    - name: Read running shard process id
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=MainPID
          - --value
          - akidb-server.service
      changed_when: false
      register: akidb_shard_main_pid

    - name: Require a running shard process
      ansible.builtin.assert:
        that:
          - akidb_shard_main_pid.stdout | trim | int > 0

    - name: Resolve the active shard binary
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - "{{ akidb_install_root }}/current/bin/akidb-server"
      changed_when: false
      register: akidb_active_shard_executable

    - name: Resolve the running shard executable
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - "/proc/{{ akidb_shard_main_pid.stdout | trim }}/exe"
      changed_when: false
      register: akidb_running_shard_executable

    - name: Require the expected shard release to be active
      ansible.builtin.assert:
        that:
          - >-
            akidb_active_shard_executable.stdout | trim ==
            akidb_install_root ~ '/releases/' ~ akidb_release_id ~
            '/bin/akidb-server'
        fail_msg: >-
          {{ inventory_hostname }} is not running the expected immutable
          release {{ akidb_release_id }}.

    - name: Require the shard to run the active immutable release
      ansible.builtin.assert:
        that:
          - akidb_running_shard_executable.stdout | trim == akidb_active_shard_executable.stdout | trim

- name: Confirm standalone single-node readiness
  hosts: akidb_shards
  become: false
  gather_facts: false
  run_once: true
  tasks:
    - name: Report standalone endpoint
      ansible.builtin.debug:
        msg: >-
          AkiDB {{ akidb_release_id }} standalone shard is ready through
          {{ hostvars[groups['akidb_shards'][0]].akidb_overlay_address }}:{{ akidb_server_port }}
          (N=1, no coordinator group).
      when: (groups.get('akidb_coordinators', []) | length) == 0

- name: Verify coordinator-to-shard paths and coordinator readiness
  hosts: akidb_coordinators
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check every shard from the coordinator host
      ansible.builtin.command:
        argv:
          - "{{ akidb_install_root }}/current/bin/akidb"
          - health
          - --server
          - "{{ hostvars[item].akidb_overlay_address }}:{{ akidb_server_port }}"
          - --require-ready
      environment:
        AKIDB_AUTH_TOKEN_FILE: "{{ akidb_config_root }}/auth.token"
      loop: "{{ groups['akidb_shards'] }}"
      changed_when: false

    - name: Check coordinator gRPC readiness
      ansible.builtin.command:
        argv:
          - "{{ akidb_install_root }}/current/bin/akidb"
          - health
          - --server
          - "{{ akidb_overlay_address }}:{{ akidb_coordinator_port }}"
          - --require-ready
      changed_when: false
      register: akidb_coordinator_health
      retries: 10
      delay: 2
      until: akidb_coordinator_health.rc == 0

    - name: Check coordinator HTTP health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ akidb_coordinator_metrics_port }}/health"
        return_content: true
        status_code: 200
      register: akidb_coordinator_http_health
      retries: 10
      delay: 2
      until: akidb_coordinator_http_health.status == 200

    - name: Read running coordinator process id
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=MainPID
          - --value
          - akidb-coordinator.service
      changed_when: false
      register: akidb_coordinator_main_pid

    - name: Require a running coordinator process
      ansible.builtin.assert:
        that:
          - akidb_coordinator_main_pid.stdout | trim | int > 0

    - name: Resolve the active coordinator binary
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - "{{ akidb_install_root }}/current/bin/akidb-coordinator"
      changed_when: false
      register: akidb_active_coordinator_executable

    - name: Resolve the running coordinator executable
      ansible.builtin.command:
        argv:
          - readlink
          - -f
          - "/proc/{{ akidb_coordinator_main_pid.stdout | trim }}/exe"
      changed_when: false
      register: akidb_running_coordinator_executable

    - name: Require the expected coordinator release to be active
      ansible.builtin.assert:
        that:
          - >-
            akidb_active_coordinator_executable.stdout | trim ==
            akidb_install_root ~ '/releases/' ~ akidb_release_id ~
            '/bin/akidb-coordinator'
        fail_msg: >-
          {{ inventory_hostname }} is not running the expected immutable
          release {{ akidb_release_id }}.

    - name: Require the coordinator to run the active immutable release
      ansible.builtin.assert:
        that:
          - akidb_running_coordinator_executable.stdout | trim == akidb_active_coordinator_executable.stdout | trim

    - name: Confirm deployed release
      ansible.builtin.debug:
        msg: >-
          AkiDB {{ akidb_release_id }} is ready through
          {{ akidb_overlay_address }}:{{ akidb_coordinator_port }} with
          {{ groups['akidb_shards'] | length }} shards
          (supported sizes: N=1 standalone, N=2, N>=4).
