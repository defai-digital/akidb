---
# Full Production Deployment
# Usage: ansible-playbook -i inventory.yml playbooks/production-deploy.yml
#
# This playbook performs a complete production deployment including:
# - System prerequisites
# - Docker configuration
# - AkiDB core services
# - Ingestion pipeline
# - Monitoring stack
# - Health verification

- name: Production Deployment - Prerequisites
  hosts: thor_cluster
  become: yes
  gather_facts: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker.io
          - curl
          - jq
          - htop
          - iotop
        state: present

    - name: Install docker-compose (standalone)
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-{{ ansible_architecture }}
        dest: /usr/local/bin/docker-compose
        mode: '0755'
      ignore_errors: yes

    - name: Add user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Configure Docker daemon for NVIDIA runtime
      copy:
        content: |
          {
            "runtimes": {
              "nvidia": {
                "path": "nvidia-container-runtime",
                "runtimeArgs": []
              }
            },
            "default-runtime": "nvidia",
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "100m",
              "max-file": "5"
            }
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
      notify: restart docker

    - name: Set Jetson power mode
      shell: nvpmodel -m 0
      ignore_errors: yes
      when: jetson_power_mode == 'MAXN'

    - name: Set up swap (Thor)
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 16G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi
      args:
        creates: /swapfile

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted

- name: Production Deployment - Core Services
  hosts: thor_cluster
  become: yes
  gather_facts: yes

  vars:
    install_dir: /opt/akidb

  tasks:
    - name: Create installation directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - "{{ install_dir }}"
        - "{{ install_dir }}/bin"
        - "{{ install_dir }}/config"
        - "{{ install_dir }}/data"
        - "{{ install_dir }}/logs"
        - "{{ install_dir }}/compose"
        - "{{ install_dir }}/compose/nats"
        - "{{ install_dir }}/compose/minio"
        - "{{ install_dir }}/compose/monitoring"
        - "{{ install_dir }}/compose/monitoring/dashboards"

    - name: Copy AkiDB binaries
      copy:
        src: "{{ local_binary_dir }}/{{ item }}"
        dest: "{{ install_dir }}/bin/{{ item }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      loop:
        - akidb-server
        - akidb-coordinator
      when: deploy_binaries | default(true)

    - name: Deploy AkiDB configuration
      template:
        src: ../templates/akidb.toml.j2
        dest: "{{ install_dir }}/config/akidb.toml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Deploy systemd service
      template:
        src: ../templates/akidb.service.j2
        dest: /etc/systemd/system/akidb.service
        owner: root
        group: root
        mode: '0644'
      notify: reload systemd

    - name: Enable and start AkiDB
      systemd:
        name: akidb
        state: started
        enabled: yes

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

- name: Production Deployment - Ingestion Pipeline
  hosts: thor_primary
  become: yes
  gather_facts: yes

  vars:
    install_dir: /opt/akidb

  tasks:
    - name: Copy Docker Compose files
      copy:
        src: "{{ item.src }}"
        dest: "{{ install_dir }}/compose/{{ item.dest }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      loop:
        - { src: "../../../deploy/compose/docker-compose.yml", dest: "docker-compose.yml" }
        - { src: "../../../deploy/compose/docker-compose.prod.yml", dest: "docker-compose.prod.yml" }
        - { src: "../../../deploy/compose/docker-compose.gpu.yml", dest: "docker-compose.gpu.yml" }
        - { src: "../../../deploy/compose/nats/nats.conf", dest: "nats/nats.conf" }
        - { src: "../../../deploy/compose/minio/setup-minio.sh", dest: "minio/setup-minio.sh" }
        - { src: "../../../deploy/compose/monitoring/prometheus.yml", dest: "monitoring/prometheus.yml" }

    - name: Copy Grafana dashboards
      copy:
        src: "{{ item }}"
        dest: "{{ install_dir }}/compose/monitoring/dashboards/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'
      with_fileglob:
        - "../../../deploy/compose/monitoring/dashboards/*.json"

    - name: Deploy environment file
      template:
        src: ../templates/ingestion.env.j2
        dest: "{{ install_dir }}/compose/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Pull Docker images
      shell: |
        cd {{ install_dir }}/compose
        docker compose pull
      become_user: "{{ ansible_user }}"

    - name: Start infrastructure services
      shell: |
        cd {{ install_dir }}/compose
        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d nats-1 nats-2 nats-3 minio minio-setup
      become_user: "{{ ansible_user }}"

    - name: Wait for infrastructure
      pause:
        seconds: 30

    - name: Start ingestion services
      shell: |
        cd {{ install_dir }}/compose
        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d doc-parser upload-gateway ingestion
      become_user: "{{ ansible_user }}"

    - name: Start monitoring
      shell: |
        cd {{ install_dir }}/compose
        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d prometheus grafana
      become_user: "{{ ansible_user }}"

- name: Production Deployment - Verification
  hosts: thor_cluster
  become: no
  gather_facts: yes

  tasks:
    - name: Wait for services to stabilize
      pause:
        seconds: 30

    - name: Check AkiDB health
      uri:
        url: "http://localhost:{{ grpc_port | default(50051) }}/health"
        method: GET
        status_code: 200
      register: akidb_health
      ignore_errors: yes

    - name: Check NATS health
      uri:
        url: "http://localhost:8222/healthz"
        method: GET
        status_code: 200
      register: nats_health
      ignore_errors: yes
      when: "'thor_primary' in group_names"

    - name: Check MinIO health
      uri:
        url: "http://localhost:9000/minio/health/live"
        method: GET
        status_code: 200
      register: minio_health
      ignore_errors: yes
      when: "'thor_primary' in group_names"

    - name: Check Prometheus health
      uri:
        url: "http://localhost:9090/-/healthy"
        method: GET
        status_code: 200
      register: prometheus_health
      ignore_errors: yes
      when: "'thor_primary' in group_names"

    - name: Generate deployment report
      debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════╗
          ║           AKIDB THOR EDITION - PRODUCTION DEPLOYMENT REPORT           ║
          ╠══════════════════════════════════════════════════════════════════════╣
          ║ Host: {{ ansible_hostname }} ({{ ansible_host }})
          ║ Timestamp: {{ ansible_date_time.iso8601 }}
          ╠══════════════════════════════════════════════════════════════════════╣
          ║ SERVICE STATUS:                                                       ║
          ║   AkiDB:      {{ 'HEALTHY ✓' if akidb_health is success else 'UNHEALTHY ✗' }}
          ║   NATS:       {{ 'HEALTHY ✓' if nats_health is success else 'N/A' if nats_health is skipped else 'UNHEALTHY ✗' }}
          ║   MinIO:      {{ 'HEALTHY ✓' if minio_health is success else 'N/A' if minio_health is skipped else 'UNHEALTHY ✗' }}
          ║   Prometheus: {{ 'HEALTHY ✓' if prometheus_health is success else 'N/A' if prometheus_health is skipped else 'UNHEALTHY ✗' }}
          ╠══════════════════════════════════════════════════════════════════════╣
          ║ ENDPOINTS:                                                            ║
          ║   AkiDB gRPC:     {{ ansible_host }}:50051
          ║   NATS:           {{ ansible_host }}:4222
          ║   MinIO API:      http://{{ ansible_host }}:9000
          ║   Upload Gateway: http://{{ ansible_host }}:8081
          ║   Grafana:        http://{{ ansible_host }}:3000
          ║   Prometheus:     http://{{ ansible_host }}:9090
          ╚══════════════════════════════════════════════════════════════════════╝
