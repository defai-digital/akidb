---
- name: Verify the controller backup through isolated services and a blank replica
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  any_errors_fatal: true
  vars:
    knowledge_backup_id: "{{ lookup('env', 'AKIDB_KNOWLEDGE_BACKUP_ID') }}"
    knowledge_backup_sha256: "{{ lookup('env', 'AKIDB_KNOWLEDGE_BACKUP_SHA256') }}"
    knowledge_backup_directory: "{{ lookup('env', 'AKIDB_KNOWLEDGE_BACKUP_DIR') }}"
    knowledge_restore_python: "{{ lookup('env', 'AKIDB_QA_PYTHON') }}"
    knowledge_restore_binary: "{{ lookup('env', 'AKIDB_RESTORE_SERVER_BIN') }}"
    knowledge_restore_evidence: "{{ lookup('env', 'AKIDB_KNOWLEDGE_RESTORE_EVIDENCE') }}"
  tasks:
    - name: Require immutable backup and explicit controller verification tools
      ansible.builtin.assert:
        that:
          - groups['ax_knowledge_gateways'] | default([]) | length > 0
          - knowledge_backup_id is match('^[a-zA-Z0-9][a-zA-Z0-9._-]{6,63}$')
          - knowledge_backup_sha256 is match('^[a-fA-F0-9]{64}$')
          - knowledge_backup_directory is match('^/')
          - knowledge_restore_python is match('^/')
          - knowledge_restore_binary is match('^/')
          - knowledge_restore_evidence is match('^/')

    - name: Verify checksum, closure, blank rebuild, retrieval, and outage reads
      ansible.builtin.command:
        argv:
          - "{{ knowledge_restore_python }}"
          - "{{ playbook_dir }}/../../../scripts/verify_knowledge_restore.py"
          - --archive
          - "{{ knowledge_backup_directory }}/{{ knowledge_backup_id }}.tar.gz"
          - --backup-id
          - "{{ knowledge_backup_id }}"
          - --sha256
          - "{{ knowledge_backup_sha256 }}"
          - --server-bin
          - "{{ knowledge_restore_binary }}"
          - --output
          - "{{ knowledge_restore_evidence }}"
      changed_when: true

    - name: Read verified restore receipt
      ansible.builtin.slurp:
        src: "{{ knowledge_restore_evidence }}"
      register: knowledge_restore_receipt

    - name: Retain exact serving verification evidence for the existing audit step
      ansible.builtin.set_fact:
        knowledge_restore_audit_details: "{{ knowledge_restore_receipt.content | b64decode | from_json }}"

    - name: Bind the verified receipt to the requested backup
      ansible.builtin.assert:
        that:
          - knowledge_restore_audit_details.backup_id == knowledge_backup_id
          - knowledge_restore_audit_details.backup_sha256 == knowledge_backup_sha256 | lower

- name: Record successful restore verification in the authoritative audit
  hosts: ax_knowledge_gateways[0]
  become: true
  become_user: "{{ ax_gateway_user }}"
  gather_facts: false
  tasks:
    - name: Append bounded restore audit evidence
      ansible.builtin.command:
        argv:
          - "{{ ax_gateway_install_root }}/current/bin/node"
          - "{{ ax_gateway_install_root }}/current/app/dist/knowledge-gateway.js"
          - knowledge-control
          - --postgres-ca
          - "{{ ax_gateway_config_root }}/tls/ca.crt"
          - --postgres-server-name
          - "{{ ax_knowledge_postgres_server_name }}"
          - maintenance-audit
          - --workspace
          - "{{ akidb_knowledge_workspace }}"
          - --collection
          - "{{ akidb_knowledge_collection }}"
          - --action
          - knowledge.restore.verified
          - --actor
          - ansible-restore-drill
          - --details-json
          - >-
            {{
              {
                'backup_id': hostvars['localhost'].knowledge_restore_audit_details.backup_id,
                'backup_sha256': hostvars['localhost'].knowledge_restore_audit_details.backup_sha256,
                'server_sha256': hostvars['localhost'].knowledge_restore_audit_details.server_sha256,
                'verified_objects': hostvars['localhost'].knowledge_restore_audit_details.verified_objects,
                'blank_replica': true,
                'dependency_outage_reads': true
              } | to_json
            }}
      environment:
        AX_KNOWLEDGE_POSTGRES_URL: "{{ ax_knowledge_postgres_url }}"
      changed_when: true
      no_log: true
