---
# Example: N=4 (and template for N>=4) independent-shard lab.
#
# Supported sizes: N=1, N=2, or N>=4 (N=3 is not a supported topology).
# Add more hosts under akidb_shards the same way for N=5,6,... — playbooks
# loop over groups['akidb_shards']; do not hardcode host counts.
#
# Service plane modes:
# - wireguard (default): public SSH only; WireGuard mesh for service traffic
# - private: VPC/vRack/private NIC IPs as akidb_overlay_address
#
# Real lab inventories live under inventories/lab/ and are gitignored.
all:
  vars:
    ansible_user: root
  children:
    akidb_cluster:
      vars:
        akidb_cluster_network_trusted: true
        akidb_service_network_mode: wireguard
        akidb_overlay_cidr: 10.77.0.0/24
        # Optional for private mode, e.g. ens4 / eth1
        # akidb_service_network_interface: ens4
      children:
        akidb_shards:
          hosts:
            akidb-1:
              ansible_host: 192.0.2.11
              akidb_overlay_address: 10.77.0.11
            akidb-2:
              ansible_host: 192.0.2.12
              akidb_overlay_address: 10.77.0.12
            akidb-3:
              ansible_host: 192.0.2.13
              akidb_overlay_address: 10.77.0.13
            akidb-4:
              ansible_host: 192.0.2.14
              akidb_overlay_address: 10.77.0.14
            # N>=5: keep adding hosts, e.g.
            # akidb-5:
            #   ansible_host: 192.0.2.15
            #   akidb_overlay_address: 10.77.0.15
        akidb_coordinators:
          hosts:
            # Active-active entrypoint HA: two or more coordinators (often
            # co-located on shard hosts). Clients should use a VIP/LB in
            # front of all coordinator :50050 endpoints. Shards remain
            # independent partitions (not replicas).
            akidb-1:
            akidb-2:
