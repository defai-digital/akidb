# AkiDB Thor Cluster Inventory
all:
  vars:
    ansible_user: devop
    ansible_python_interpreter: /usr/bin/python3
    akidb_version: "0.1.0"
    akidb_install_dir: /opt/akidb
    akidb_data_dir: /data/akidb
    local_binary_dir: "../../../target/aarch64-unknown-linux-gnu/release"

    # MinIO Configuration
    minio_bucket: akidb-documents
    minio_root_user: akidb-admin
    minio_root_password: "{{ vault_minio_password | default('CHANGE_ME_IN_VAULT') }}"
    minio_region: us-east-1

    # Grafana Configuration
    grafana_admin_user: admin
    grafana_admin_password: "{{ vault_grafana_password | default('CHANGE_ME_IN_VAULT') }}"
    grafana_root_url: "http://{{ ansible_host }}:3000"

    # AkiDB Configuration
    akidb_server_host: akidb-server
    akidb_timeout_ms: 60000
    akidb_max_retries: 5

    # Embedding Configuration
    embedding_host: embedding
    embedding_model: "Qwen/Qwen3-Embedding-8B"

    # Thor-Specific Settings
    gpu_memory_utilization: 0.8
    jetson_power_mode: MAXN

    # Logging
    rust_log_level: "info,akidb_ingestion=info"
    rust_backtrace: 1

    # Ingestion Tuning
    circuit_breaker_threshold: 5
    circuit_breaker_reset_secs: 60
    circuit_breaker_half_open_calls: 3
    backpressure_latency_threshold_ms: 500
    backpressure_queue_depth: 20000
    backpressure_pause_secs: 10
    memory_pause_threshold_pct: 75
    memory_resume_threshold_pct: 65
    batcher_min_batch: 32
    batcher_max_batch: 128
    batcher_timeout_ms: 200
    chunker_target_tokens: 512
    chunker_min_overlap: 20
    chunker_max_overlap: 50

  children:
    thor_cluster:
      hosts:
        thor-01:
          ansible_host: 192.168.1.61
          hostname: DEVOP-THOR-01
          shard_id: 0
          is_coordinator: true
          grpc_port: 50051

        thor-02:
          ansible_host: 192.168.1.62
          hostname: DEVOP-THOR-02
          shard_id: 1
          is_coordinator: false
          grpc_port: 50051

    coordinators:
      hosts:
        thor-01:

    shards:
      hosts:
        thor-01:
        thor-02:

    minio_nodes:
      hosts:
        thor-01:
        thor-02:

    # Primary node runs ingestion pipeline
    thor_primary:
      hosts:
        thor-01:
