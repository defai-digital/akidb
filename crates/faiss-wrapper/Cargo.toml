[package]
name = "akidb-faiss"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["cpu"]
cpu = []
# Portable development/runtime backend. This is the supported mode for
# macOS Apple Silicon (M2 or later) and for Linux hosts without CUDA.
portable = ["cpu"]
# NVIDIA CUDA backend for Jetson Thor/Linux. Requires CUDA and FAISS GPU.
gpu = []
# cuVS shadow-mode scaffolding. The current implementation is mock-backed
# until native cuVS FFI bindings are added.
cuvs = []

[dependencies]
akidb-common = { path = "../common" }
akidb-invariants = { path = "../invariants" }
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["fs", "time"] }
bincode = "1.3"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
mockall.workspace = true

# Benchmarks will be added in Phase 1
# [[bench]]
# name = "vector_search"
# harness = false
