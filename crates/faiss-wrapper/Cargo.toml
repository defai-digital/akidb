[package]
name = "akidb-faiss"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["cpu"]
cpu = []
# Supported backend for macOS Apple Silicon.
portable = ["cpu"]
# Unsupported legacy switch. Kept only so callers get a clear build error.
gpu = []

[dependencies]
akidb-common = { path = "../common" }
akidb-invariants = { path = "../invariants" }
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
parking_lot.workspace = true
serde = { workspace = true, features = ["derive"] }
uuid = { workspace = true, features = ["v4"] }
tokio = { workspace = true, features = ["fs", "time"] }
bincode = "1.3"

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
mockall.workspace = true

# Benchmarks will be added in Phase 1
# [[bench]]
# name = "vector_search"
# harness = false
