[package]
name = "akidb-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Single entry point CLI for AkiDB"

[[bin]]
name = "akidb"
path = "src/main.rs"

[features]
default = []
generation-s3 = ["akidb-server/generation-s3"]
generation-postgres = ["generation-s3", "akidb-server/generation-postgres"]

[dependencies]
akidb-contracts = { path = "../contracts" }
akidb-common = { path = "../common" }
akidb-coordinator = { path = "../coordinator" }
akidb-embedding = { path = "../embedding" }
akidb-graph = { path = "../graph" }
akidb-proto = { path = "../proto" }
akidb-retrieval = { path = "../retrieval" }
akidb-server = { path = "../server" }
akidb-storage = { path = "../storage" }
akidb-tui = { path = "../tui" }

anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
prost.workspace = true
tempfile.workspace = true
libc = "0.2"
tokio.workspace = true
tonic.workspace = true
toml = "0.8"
url.workspace = true
