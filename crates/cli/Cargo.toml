[package]
name = "akidb-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Single entry point CLI for AkiDB"

[[bin]]
name = "akidb"
path = "src/main.rs"

[dependencies]
akidb-coordinator = { path = "../coordinator" }
akidb-graph = { path = "../graph" }
akidb-proto = { path = "../proto" }
akidb-server = { path = "../server" }
akidb-storage = { path = "../storage" }
akidb-tui = { path = "../tui" }

anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tonic.workspace = true
