[package]
name = "akidb-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "akidb-server"
path = "src/main.rs"

[features]
default = []
postgres = ["akidb-sql/postgres"]
generation-s3 = ["akidb-grpc/generation-s3", "dep:akidb-contracts"]

[dependencies]
akidb-common = { path = "../common" }
akidb-contracts = { path = "../contracts", optional = true }
akidb-embedding = { path = "../embedding" }
akidb-faiss = { path = "../faiss-wrapper" }
akidb-graph = { path = "../graph" }
akidb-sql = { path = "../sql" }
akidb-storage = { path = "../storage" }
akidb-grpc = { path = "../grpc-server" }
akidb-proto = { path = "../proto" }

tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
