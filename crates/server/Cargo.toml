[package]
name = "akidb-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "akidb-server"
path = "src/main.rs"

[features]
default = []
postgres = ["akidb-sql/postgres"]

[dependencies]
akidb-common = { path = "../common" }
akidb-faiss = { path = "../faiss-wrapper" }
akidb-graph = { path = "../graph" }
akidb-sql = { path = "../sql" }
akidb-storage = { path = "../storage" }
akidb-grpc = { path = "../grpc-server" }
akidb-coordinator = { path = "../coordinator" }

tokio.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
