[package]
name = "akidb-grpc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
generation-s3 = ["dep:aws-sdk-s3", "dep:aws-config"]

[dependencies]
akidb-common = { path = "../common" }
akidb-contracts = { path = "../contracts" }
akidb-proto = { path = "../proto" }
akidb-faiss = { path = "../faiss-wrapper" }
akidb-storage = { path = "../storage" }
akidb-retrieval = { path = "../retrieval" }
akidb-graph = { path = "../graph" }
akidb-sql = { path = "../sql" }

tonic.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Metrics
prometheus.workspace = true

# Concurrency
dashmap.workspace = true
parking_lot.workspace = true

# UUID for run IDs
uuid.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
url.workspace = true
aws-sdk-s3 = { version = "1.137", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-config = { version = "1.8", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
percent-encoding = "2.3"

# HTTP client for webhooks
reqwest.workspace = true

# Cryptography for webhook signatures
sha2.workspace = true
hmac = "0.12"
hex = "0.4"

[dev-dependencies]
tempfile.workspace = true
