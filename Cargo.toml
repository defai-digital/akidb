[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/contracts",
    "crates/invariants",
    "crates/faiss-wrapper",
    "crates/retrieval",
    "crates/storage",
    "crates/grpc-server",
    "crates/coordinator",
    "crates/server",
    "crates/cli",
    "crates/benchmark",
    "crates/ingestion-orchestrator",
    "crates/tui",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
authors = ["AkiDB Team"]
license = "Apache-2.0"
repository = "https://github.com/defai-digital/akidb"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# gRPC
tonic = "0.11"
tonic-build = "0.11"
prost = "0.12"
prost-types = "0.12"

# Storage
rocksdb = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.22"
opentelemetry-otlp = "0.15"
tracing-opentelemetry = "0.23"

# Metrics
prometheus = "0.14"

# Testing
criterion = "0.5"
mockall = "0.12"
tempfile = "3.10"

# Utilities
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }
roaring = "0.10"
bytes = "1.5"
parking_lot = "0.12"
dashmap = "5.5"
crossbeam = "0.8"

# Object Storage (S3/MinIO compatible)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
