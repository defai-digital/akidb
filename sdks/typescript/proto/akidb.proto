syntax = "proto3";

package akidb.v1;

// AkiDB Vector Database Service
service Akidb {
  // Insert a vector
  rpc Insert(InsertRequest) returns (InsertResponse);

  // Search for similar vectors
  rpc Search(SearchRequest) returns (SearchResponse);

  // Delete a vector
  rpc Delete(DeleteRequest) returns (DeleteResponse);

  // Update a vector (upsert semantics)
  rpc Update(UpdateRequest) returns (UpdateResponse);

  // Get a vector by ID
  rpc Get(GetRequest) returns (GetResponse);

  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);

  // Batch insert
  rpc InsertBatch(InsertBatchRequest) returns (InsertBatchResponse);

  // Batch search
  rpc SearchBatch(SearchBatchRequest) returns (SearchBatchResponse);

  // Get cluster state (coordinators and shards)
  rpc GetClusterState(GetClusterStateRequest) returns (GetClusterStateResponse);

  // Text search: embed text via ax-engine, then search for similar vectors
  rpc TextSearch(TextSearchRequest) returns (SearchResponse);

  // Collection lifecycle (GAP-005)
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc GetCollection(GetCollectionRequest) returns (GetCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
}

// ============================================
// Authoritative Agent Memory (experimental)
// ============================================

// This service is disabled by default and is independent from the legacy
// metadata-backed memory_write/memory_read helpers.
service MemoryService {
  rpc GetMemoryCapabilities(GetMemoryCapabilitiesRequest) returns (GetMemoryCapabilitiesResponse);
  rpc Observe(MemoryObserveRequest) returns (MemoryObserveReceipt);
  rpc Propose(MemoryProposeRequest) returns (MemoryMutationReceipt);
  rpc Commit(MemoryCommitRequest) returns (MemoryMutationReceipt);
  rpc Remember(MemoryRememberRequest) returns (MemoryMutationReceipt);
  rpc Get(MemoryGetRequest) returns (MemoryGetResponse);
  rpc Recall(MemoryRecallRequest) returns (MemoryRecallResponse);
  rpc ExplainRecall(MemoryExplainRecallRequest) returns (MemoryExplainRecallResponse);
  rpc ReplayRecall(MemoryReplayRecallRequest) returns (MemoryReplayRecallResponse);
  rpc Correct(MemoryCorrectRequest) returns (MemoryMutationReceipt);
  rpc Retract(MemoryRetractRequest) returns (MemoryMutationReceipt);
  rpc Forget(MemoryForgetRequest) returns (MemoryMutationReceipt);
  rpc ListHistory(MemoryListHistoryRequest) returns (MemoryListHistoryResponse);
  rpc Export(MemoryExportRequest) returns (stream MemoryExportRecord);
  rpc PlanDeletion(MemoryPlanDeletionRequest) returns (MemoryDeletionPlan);
  rpc ExecuteDeletion(MemoryExecuteDeletionRequest) returns (MemoryDeletionExecutionReceipt);
  rpc Reinforce(MemoryReinforceRequest) returns (MemoryMutationReceipt);
}

message MemoryRequestContext {
  string workspace_id = 1;
  string namespace = 2;
  string request_purpose = 3;
  optional string delegated_agent_id = 4;
  optional string idempotency_key = 5;
  optional string request_id = 6;
  MemoryScopeNarrowing scope_narrowing = 7;
}

enum MemorySensitivity {
  MEMORY_SENSITIVITY_UNSPECIFIED = 0;
  MEMORY_SENSITIVITY_PUBLIC = 1;
  MEMORY_SENSITIVITY_INTERNAL = 2;
  MEMORY_SENSITIVITY_CONFIDENTIAL = 3;
  MEMORY_SENSITIVITY_RESTRICTED = 4;
}

message MemoryScopeNarrowing {
  repeated string entity_keys = 1;
  repeated string data_subject_ids = 2;
  repeated string session_ids = 3;
  repeated string task_ids = 4;
  optional MemorySensitivity maximum_sensitivity = 5;
}

message MemoryScopeInput {
  string entity_key = 1;
  optional string data_subject_id = 2;
  optional string owner_agent_id = 3;
  optional string session_id = 4;
  optional string task_id = 5;
  MemorySensitivity sensitivity = 6;
  repeated string allowed_purposes = 7;
}

message MemoryTextFact {
  string text = 1;
  optional string language = 2;
}

message MemoryStructuredFact {
  string schema_id = 1;
  bytes canonical_json = 2;
}

message MemoryProcedure {
  string title = 1;
  repeated string ordered_steps = 2;
  repeated string preconditions = 3;
  repeated string failure_recovery = 4;
}

message MemoryPreference {
  string value = 1;
  optional string context = 2;
}

message MemoryEpisodeReference {
  repeated string event_ids = 1;
  optional string summary = 2;
}

message MemoryContent {
  oneof value {
    MemoryTextFact text_fact = 1;
    MemoryStructuredFact structured_fact = 2;
    MemoryProcedure procedure = 3;
    MemoryPreference preference = 4;
    MemoryEpisodeReference episode_reference = 5;
  }
}

enum MemoryEpistemicFormation {
  MEMORY_FORMATION_UNSPECIFIED = 0;
  MEMORY_FORMATION_DIRECT_OBSERVATION = 1;
  MEMORY_FORMATION_HUMAN_STATEMENT = 2;
  MEMORY_FORMATION_AGENT_STATEMENT = 3;
  MEMORY_FORMATION_MODEL_INFERENCE = 4;
  MEMORY_FORMATION_DETERMINISTIC_DERIVATION = 5;
  MEMORY_FORMATION_CONSOLIDATED_SUMMARY = 6;
}

message MemoryEvidenceInput {
  string source_plane = 1;
  string source_id = 2;
  optional string source_version = 3;
  optional uint64 observed_at_ms = 4;
  string content_sha256 = 5;
  optional string source_principal_id = 6;
  optional int64 observed_at_unix_nanos = 7;
}

message MemoryDerivationInput {
  repeated string input_version_ids = 1;
  repeated string input_evidence_ids = 2;
  string operation = 3;
  optional string compiler_artifact_id = 4;
  string deterministic_parameters_sha256 = 5;
}

message MemoryVersionInput {
  MemoryScopeInput scope = 1;
  string predicate = 2;
  MemoryContent content = 3;
  optional int64 valid_from_ms = 4;
  optional int64 valid_to_ms = 5;
  MemoryEpistemicFormation epistemic_formation = 6;
  optional float confidence = 7;
  repeated MemoryEvidenceInput evidence = 8;
  repeated string expected_head_version_ids = 9;
  string reason = 10;
  optional int64 valid_from_unix_nanos = 11;
  optional int64 valid_to_unix_nanos = 12;
  optional string compiler_artifact_id = 13;
  optional MemoryDerivationInput derivation = 14;
}

message MemoryRememberRequest {
  MemoryRequestContext context = 1;
  MemoryScopeInput scope = 2;
  string predicate = 3;
  MemoryContent content = 4;
  optional int64 valid_from_ms = 5;
  optional int64 valid_to_ms = 6;
  MemoryEpistemicFormation epistemic_formation = 7;
  optional float confidence = 8;
  repeated MemoryEvidenceInput evidence = 9;
  repeated string expected_head_version_ids = 10;
  string reason = 11;
  optional int64 valid_from_unix_nanos = 12;
  optional int64 valid_to_unix_nanos = 13;
  optional string compiler_artifact_id = 14;
  optional MemoryDerivationInput derivation = 15;
}

message MemoryObserveRequest {
  MemoryRequestContext context = 1;
  MemoryScopeInput scope = 2;
  string source_plane = 3;
  string source_id = 4;
  optional string source_version = 5;
  optional uint64 observed_at_ms = 6;
  string content_sha256 = 7;
  bytes retained_payload = 8;
  string reason = 9;
  optional int64 observed_at_unix_nanos = 10;
}

message MemoryObserveReceipt {
  string mutation_id = 1;
  string observation_id = 2;
  string evidence_id = 3;
  uint64 commit_sequence = 4;
  string durability = 5;
  string projection_status = 6;
  optional MemoryVisibilityReceipt visibility = 7;
  string policy_decision_id = 8;
  MemoryServerCapabilities capabilities = 9;
  bool duplicate = 10;
}

message MemoryProposeRequest {
  MemoryRequestContext context = 1;
  MemoryVersionInput candidate = 2;
}

message MemoryCommitRequest {
  MemoryRequestContext context = 1;
  string proposal_version_id = 2;
  repeated string expected_head_version_ids = 3;
  string reason = 4;
}

message MemoryCorrectRequest {
  MemoryRequestContext context = 1;
  MemoryVersionInput successor = 2;
}

message MemoryVisibilityReceipt {
  string workspace_id = 1;
  uint64 commit_sequence = 2;
  string projection_set_id = 3;
  uint32 projection_set_version = 4;
  uint64 visible_sequence = 5;
}

message MemoryServerCapabilities {
  string profile_status = 1;
  repeated string supported_rpcs = 2;
  repeated string supported_temporal_modes = 3;
  repeated string durability_modes = 4;
  repeated string active_projection_recipes = 5;
  string workspace_topology = 6;
  bool insecure_development_mode = 7;
  bool dense_retrieval_available = 8;
  string retention_summary = 9;
  string active_projection_manifest_sha256 = 10;
  string policy_manifest_id = 11;
  string tokenizer_artifact_id = 12;
  string context_firewall_artifact_id = 13;
  string server_build_id = 14;
  MemoryRetentionPolicy retention_policy = 15;
}

message MemoryRetentionPolicy {
  uint64 raw_event_seconds = 1;
  uint64 memory_version_seconds = 2;
  uint64 compiler_artifact_seconds = 3;
  uint64 index_artifact_seconds = 4;
  uint64 audit_seconds = 5;
  uint64 snapshot_seconds = 6;
  bool zero_means_indefinite = 7;
  bool finite_windows_enforced = 8;
}

message MemoryMutationReceipt {
  string mutation_id = 1;
  string assertion_id = 2;
  repeated string version_ids = 3;
  uint64 commit_sequence = 4;
  string durability = 5;
  string projection_status = 6;
  optional MemoryVisibilityReceipt visibility = 7;
  string policy_decision_id = 8;
  MemoryServerCapabilities capabilities = 9;
  bool duplicate = 10;
  MemoryVersionState version_state = 11;
}

message GetMemoryCapabilitiesRequest {}

message GetMemoryCapabilitiesResponse {
  MemoryServerCapabilities capabilities = 1;
}

enum MemoryVersionState {
  MEMORY_VERSION_STATE_UNSPECIFIED = 0;
  MEMORY_VERSION_STATE_PROPOSED = 1;
  MEMORY_VERSION_STATE_QUARANTINED = 2;
  MEMORY_VERSION_STATE_ACTIVE = 3;
  MEMORY_VERSION_STATE_SUPERSEDED = 4;
  MEMORY_VERSION_STATE_RETRACTED = 5;
  MEMORY_VERSION_STATE_TOMBSTONED = 6;
}

message MemoryEvidenceRecord {
  string evidence_id = 1;
  string source_plane = 2;
  string source_id = 3;
  optional string source_version = 4;
  optional uint64 observed_at_ms = 5;
  string content_sha256 = 6;
  optional string source_principal_id = 7;
  string source_assurance = 8;
  uint64 created_sequence = 9;
  optional int64 observed_at_unix_nanos = 10;
}

message MemoryItem {
  string assertion_id = 1;
  string version_id = 2;
  string namespace = 3;
  string entity_key = 4;
  string predicate = 5;
  MemoryContent content = 6;
  MemoryVersionState state = 7;
  optional int64 valid_from_ms = 8;
  optional int64 valid_to_ms = 9;
  string epistemic_formation = 10;
  string source_assurance = 11;
  string decision_authority = 12;
  optional float confidence = 13;
  repeated MemoryEvidenceRecord evidence = 14;
  uint64 committed_sequence = 15;
  uint64 committed_at_ms = 16;
  float score = 17;
  repeated string score_signals = 18;
  string reason = 19;
  optional int64 valid_from_unix_nanos = 20;
  optional int64 valid_to_unix_nanos = 21;
  optional string compiler_artifact_id = 22;
  optional MemoryDerivationRecord derivation = 23;
  optional MemoryPolicyDecisionRecord policy_decision = 24;
  repeated MemoryRelationRecord relations = 25;
  repeated MemoryReinforcementRecord reinforcements = 26;
}

enum MemoryTemporalMode {
  MEMORY_TEMPORAL_MODE_UNSPECIFIED = 0;
  MEMORY_TEMPORAL_MODE_CURRENT = 1;
  MEMORY_TEMPORAL_MODE_VALID_AT = 2;
  MEMORY_TEMPORAL_MODE_SYSTEM_AS_OF = 3;
  MEMORY_TEMPORAL_MODE_VALID_AT_AS_KNOWN_AT = 4;
}

message MemoryTemporalQuery {
  MemoryTemporalMode mode = 1;
  optional int64 valid_at_unix_nanos = 2;
  optional uint64 commit_sequence = 3;
}

message MemoryDerivationRecord {
  string derivation_id = 1;
  repeated string input_version_ids = 2;
  repeated string input_evidence_ids = 3;
  string operation = 4;
  optional string compiler_artifact_id = 5;
  string deterministic_parameters_sha256 = 6;
  string output_version_id = 7;
  uint64 committed_sequence = 8;
}

message MemoryPolicyDecisionRecord {
  string policy_decision_id = 1;
  string policy_manifest_id = 2;
  string outcome = 3;
  string source_assurance = 4;
  string decision_authority = 5;
  repeated string reason_codes = 6;
  string authorization_decision_id = 7;
  uint64 committed_sequence = 8;
}

message MemoryRelationRecord {
  string relation_id = 1;
  string kind = 2;
  string from_version_id = 3;
  string to_version_id = 4;
  string mutation_id = 5;
  uint64 committed_sequence = 6;
}

message MemoryGetRequest {
  MemoryRequestContext context = 1;
  oneof target {
    string assertion_id = 2;
    string version_id = 3;
  }
  optional uint64 canonical_at_sequence = 4;
  optional MemoryTemporalQuery temporal_query = 5;
}

message MemoryGetResponse {
  bool found = 1;
  optional MemoryItem item = 2;
  uint64 canonical_sequence = 3;
  MemoryServerCapabilities capabilities = 4;
}

message MemoryRecallRequest {
  MemoryRequestContext context = 1;
  optional string query_text = 2;
  repeated string structured_predicates = 3;
  repeated string entity_keys = 4;
  uint32 max_items = 5;
  optional uint32 max_context_tokens = 6;
  bool deterministic = 7;
  bool include_explanation_summary = 8;
  optional uint64 canonical_at_sequence = 9;
  optional MemoryTemporalQuery temporal_query = 10;
  bool include_conflicts = 11;
  optional string recipe = 12;
}

message MemoryRecallResponse {
  repeated MemoryItem items = 1;
  string rendered_context = 2;
  string snapshot_id = 3;
  MemoryVisibilityReceipt visibility = 4;
  repeated string partial_status = 5;
  string policy_decision_id = 6;
  MemoryServerCapabilities capabilities = 7;
}

message MemoryRecallCandidateDecision {
  string assertion_id = 1;
  string version_id = 2;
  bool admitted_to_bounded_pool = 3;
  bool included_in_response = 4;
  optional uint32 final_rank = 5;
  float score = 6;
  repeated string score_signals = 7;
  repeated string decision_codes = 8;
  string content_sha256 = 9;
}

message MemoryExplainRecallRequest {
  MemoryRequestContext context = 1;
  string snapshot_id = 2;
}

message MemoryExplainRecallResponse {
  string snapshot_id = 1;
  uint64 visible_sequence = 2;
  string projection_set_id = 3;
  uint32 projection_set_version = 4;
  string projection_manifest_sha256 = 5;
  repeated string artifact_ids = 6;
  repeated MemoryRecallCandidateDecision candidates = 7;
  string bounded_pool_semantics = 8;
  string policy_decision_id = 9;
  string explanation_sha256 = 10;
}

enum MemoryReplayMode {
  MEMORY_REPLAY_MODE_UNSPECIFIED = 0;
  MEMORY_REPLAY_MODE_EXACT_RETAINED = 1;
  MEMORY_REPLAY_MODE_REEXECUTE = 2;
}

enum MemoryReplayComparisonStatus {
  MEMORY_REPLAY_COMPARISON_STATUS_UNSPECIFIED = 0;
  MEMORY_REPLAY_COMPARISON_STATUS_EXACT_MATCH = 1;
  MEMORY_REPLAY_COMPARISON_STATUS_MISMATCH = 2;
  MEMORY_REPLAY_COMPARISON_STATUS_EXPECTED_NONDETERMINISM = 3;
  MEMORY_REPLAY_COMPARISON_STATUS_ARTIFACT_EXPIRED = 4;
  MEMORY_REPLAY_COMPARISON_STATUS_POLICY_DENIED = 5;
  MEMORY_REPLAY_COMPARISON_STATUS_CORRUPTION = 6;
}

message MemoryReplayRecallRequest {
  MemoryRequestContext context = 1;
  string snapshot_id = 2;
  MemoryReplayMode mode = 3;
}

message MemoryReplayRecallResponse {
  MemoryRecallResponse recall = 1;
  string replay_mode = 2;
  bool exact_match = 3;
  string response_sha256 = 4;
  MemoryReplayComparisonStatus comparison_status = 5;
  repeated string mismatch_fields = 6;
  string expected_response_sha256 = 7;
  string actual_response_sha256 = 8;
  bool artifacts_retained = 9;
}

message MemoryForgetRequest {
  MemoryRequestContext context = 1;
  oneof target {
    string assertion_id = 2;
    string version_id = 3;
  }
  repeated string expected_head_version_ids = 4;
  string reason = 5;
}

message MemoryRetractRequest {
  MemoryRequestContext context = 1;
  oneof target {
    string assertion_id = 2;
    string version_id = 3;
  }
  repeated string expected_head_version_ids = 4;
  string reason = 5;
}

message MemoryAssertionRecord {
  string assertion_id = 1;
  string workspace_id = 2;
  string namespace = 3;
  string entity_key = 4;
  string predicate = 5;
  string kind = 6;
  uint32 identity_hash_version = 7;
  string identity_hash = 8;
  uint64 created_sequence = 9;
  uint64 created_at_ms = 10;
}

message MemoryLifecycleTransition {
  string version_id = 1;
  MemoryVersionState state = 2;
  uint64 transition_sequence = 3;
  string transition_mutation_id = 4;
}

message MemoryMutationRecord {
  string mutation_id = 1;
  string operation = 2;
  string assertion_id = 3;
  repeated string input_version_ids = 4;
  repeated string output_version_ids = 5;
  repeated string expected_head_version_ids = 6;
  string principal_id = 7;
  optional string delegated_agent_id = 8;
  string authorization_decision_id = 9;
  string policy_decision_id = 10;
  string reason = 11;
  uint64 committed_sequence = 12;
  uint64 committed_at_ms = 13;
  string canonical_request_sha256 = 14;
}

message MemoryListHistoryRequest {
  MemoryRequestContext context = 1;
  string assertion_id = 2;
  optional uint64 from_sequence = 3;
  optional uint64 to_sequence = 4;
  uint32 limit = 5;
}

message MemoryListHistoryResponse {
  bool found = 1;
  optional MemoryAssertionRecord assertion = 2;
  repeated MemoryItem versions = 3;
  repeated MemoryLifecycleTransition lifecycle_transitions = 4;
  repeated MemoryMutationRecord mutations = 5;
  repeated MemoryRelationRecord relations = 6;
  uint64 canonical_sequence = 7;
  MemoryServerCapabilities capabilities = 8;
}

message MemoryExportRequest {
  MemoryRequestContext context = 1;
  uint32 limit = 2;
}

message MemoryExportRecord {
  string record_type = 1;
  string record_id = 2;
  bytes canonical_json = 3;
  string sha256 = 4;
}

message MemorySourceDeletionSelector {
  string source_plane = 1;
  string source_id = 2;
}

message MemoryDeletionSelector {
  oneof selector {
    MemorySourceDeletionSelector source = 1;
    string data_subject_id = 2;
  }
}

message MemoryPlanDeletionRequest {
  MemoryRequestContext context = 1;
  MemoryDeletionSelector selector = 2;
  string reason = 3;
  optional uint64 expires_in_seconds = 4;
}

message MemoryDeletionPlan {
  string plan_id = 1;
  string plan_sha256 = 2;
  uint64 created_sequence = 3;
  uint64 created_at_ms = 4;
  uint64 expires_at_ms = 5;
  repeated string affected_assertion_ids = 6;
  repeated string affected_version_ids = 7;
  repeated string affected_evidence_ids = 8;
  repeated string affected_observation_ids = 9;
  repeated string affected_snapshot_ids = 10;
  string selector_type = 11;
  uint64 total_affected_records = 12;
  MemoryServerCapabilities capabilities = 13;
  repeated string affected_reinforcement_ids = 14;
}

message MemoryExecuteDeletionRequest {
  MemoryRequestContext context = 1;
  string plan_id = 2;
  string plan_sha256 = 3;
  string reason = 4;
}

message MemoryDeletionExecutionReceipt {
  string execution_id = 1;
  string plan_id = 2;
  string plan_sha256 = 3;
  string mutation_id = 4;
  uint64 commit_sequence = 5;
  string durability = 6;
  string projection_status = 7;
  optional MemoryVisibilityReceipt visibility = 8;
  string policy_decision_id = 9;
  bool duplicate = 10;
  repeated string affected_assertion_ids = 11;
  repeated string affected_version_ids = 12;
  repeated string affected_evidence_ids = 13;
  repeated string affected_observation_ids = 14;
  repeated string affected_snapshot_ids = 15;
  repeated string tombstone_ids = 16;
  MemoryServerCapabilities capabilities = 17;
  repeated string affected_reinforcement_ids = 18;
}

enum MemoryReinforcementOutcome {
  MEMORY_REINFORCEMENT_OUTCOME_UNSPECIFIED = 0;
  MEMORY_REINFORCEMENT_OUTCOME_SUCCEEDED = 1;
  MEMORY_REINFORCEMENT_OUTCOME_FAILED = 2;
  MEMORY_REINFORCEMENT_OUTCOME_NEUTRAL = 3;
}

message MemoryReinforceRequest {
  MemoryRequestContext context = 1;
  string version_id = 2;
  repeated MemoryEvidenceInput evidence = 3;
  MemoryReinforcementOutcome outcome = 4;
  string outcome_id = 5;
  sint32 utility_micros = 6;
  string reason = 7;
}

message MemoryReinforcementRecord {
  string reinforcement_id = 1;
  string version_id = 2;
  repeated string evidence_ids = 3;
  MemoryReinforcementOutcome outcome = 4;
  string outcome_id = 5;
  sint32 utility_micros = 6;
  string policy_decision_id = 7;
  string created_by_principal_id = 8;
  uint64 committed_sequence = 9;
  uint64 committed_at_ms = 10;
}

// Collection management (v3.1 schema surface)
message CreateCollectionRequest {
  string name = 1;
  uint32 dimensions = 2;
  string metric = 3;               // cosine | l2 | ip
  string embedding_model_id = 4;
  string vector_precision = 5;     // f32 | f16
  string chunk_strategy = 6;
}

message CreateCollectionResponse {
  bool success = 1;
  string name = 2;
  string message = 3;
}

message GetCollectionRequest {
  string name = 1;
}

message CollectionInfo {
  string name = 1;
  uint32 dimensions = 2;
  string metric = 3;
  string embedding_model_id = 4;
  string vector_precision = 5;
  string chunk_strategy = 6;
  uint64 vector_count = 7;
}

message GetCollectionResponse {
  bool found = 1;
  CollectionInfo collection = 2;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated CollectionInfo collections = 1;
}

message DropCollectionRequest {
  string name = 1;
}

message DropCollectionResponse {
  bool success = 1;
  string message = 2;
}

// Insert request
message InsertRequest {
  string collection = 1;
  string id = 2;
  repeated float vector = 3;
  bytes metadata = 4;  // Optional JSON metadata
  string text = 5;  // Optional source text for lexical (BM25) hybrid retrieval
}

message InsertResponse {
  bool success = 1;
  string id = 2;
  int64 internal_id = 3;
  VisibilityInfo visibility = 4;
}

// Search request
message SearchRequest {
  string collection = 1;
  repeated float query = 2;
  uint32 top_k = 3;
  optional uint32 nprobe = 4;  // IVF probes, default 32
  bytes filter = 5;  // Optional metadata filter (legacy JSON)
  TagFilter tag_filter = 6;  // Optional typed tag filter
  // Minimum score to keep (similarity; higher is better). Unset = no cut.
  optional float score_threshold = 7;
  // Group results by metadata key (e.g. parent_id, document_id); keep group_size per key.
  string group_by = 8;
  optional uint32 group_size = 9;  // default 1 when group_by set
}

message SearchResponse {
  repeated SearchResult results = 1;
  bool partial = 2;  // True if some shards were unavailable
  repeated string missing_shards = 3;
  float coverage = 4;  // 0.0 - 1.0
  uint64 latency_us = 5;
  bool within_slo = 6;
  bool degraded_mode = 7;
  string context_pack = 8;  // Optional assembled context pack (TextSearch pack=true)
  ServingGenerationEvidence serving_generation = 9;
  ContextPackV1 context_pack_v1 = 10;
  RetrievalDiagnostics diagnostics = 11;
}

message SearchResult {
  string id = 1;
  float score = 2;
  string metadata = 3;
}

// Canonical, generation-stable source pointer for one packed chunk.
message RetrievalCitationV1 {
  string chunk_id = 1;
  string document_id = 2;
  string document_version = 3;
  string source_uri = 4;
  string source_version = 5;
  string content_hash = 6;
  optional uint64 start_offset = 7;
  optional uint64 end_offset = 8;
  string generation_id = 9;
}

message ContextPackItemV1 {
  string chunk_id = 1;
  string text = 2;
  float score = 3;
  string reason = 4;
  RetrievalCitationV1 citation = 5;
}

// Typed form of context_pack. The legacy text field remains for compatibility.
message ContextPackV1 {
  string schema_version = 1;
  repeated ContextPackItemV1 items = 2;
  uint32 token_budget = 3;
  uint32 used_tokens = 4;
  bool truncated = 5;
  string text = 6;
}

message GraphEdgeEvidence {
  string edge_id = 1;
  string predicate = 2;
  string source_uri = 3;
  string source_version = 4;
  repeated string evidence_chunk_ids = 5;
  float confidence = 6;
}

message GraphExpansionEvidence {
  string result_id = 1;
  string seed_id = 2;
  uint32 hop = 3;
  float score_contribution = 4;
  repeated GraphEdgeEvidence path = 5;
}

// Explain data is bounded by the graph request limits and never includes raw
// document text.
message RetrievalDiagnostics {
  string requested_mode = 1;
  string resolved_mode = 2;
  repeated string planner_reasons = 3;
  uint32 dense_candidates = 4;
  uint32 lexical_candidates = 5;
  uint32 filtered_candidates = 6;
  bool filter_applied = 7;
  bool rerank_applied = 8;
  bool diversity_applied = 9;
  uint32 graph_depth = 10;
  uint32 graph_per_seed_fanout = 11;
  uint32 graph_max_expanded_nodes = 12;
  uint32 graph_expanded_nodes = 13;
  bool graph_truncated = 14;
  float graph_hop_decay = 15;
  repeated GraphExpansionEvidence graph_expansions = 16;
}

// Delete request
message DeleteRequest {
  string collection = 1;
  string id = 2;
}

message DeleteResponse {
  bool success = 1;
  string id = 2;
  DeleteStatus status = 3;
  string visibility = 4;  // "immediate"
}

enum DeleteStatus {
  DELETED = 0;
  NOT_FOUND = 1;
  ALREADY_DELETED = 2;
}

// Update request
message UpdateRequest {
  string collection = 1;
  string id = 2;
  repeated float vector = 3;
  bytes metadata = 4;
}

message UpdateResponse {
  bool success = 1;
  string id = 2;
  UpdateStatus status = 3;
  VisibilityInfo visibility = 4;
}

enum UpdateStatus {
  UPDATED = 0;
  CREATED = 1;  // Upsert created new
}

// Visibility info
message VisibilityInfo {
  string delete_visibility = 1;  // "immediate"
  string insert_visibility = 2;  // "within_100ms"
}

// Get request
message GetRequest {
  string collection = 1;
  string id = 2;
}

message GetResponse {
  string id = 1;
  repeated float vector = 2;
  string metadata = 3;
  bool found = 4;
  ServingGenerationEvidence serving_generation = 5;
}

// Health check
message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  bool ready = 2;
  string message = 3;
  uint64 total_vectors = 4;
  uint64 active_vectors = 5;
  bool using_gpu = 6;
  ServingGenerationEvidence serving_generation = 7;
}

// Exact immutable projection that served a response. This is populated by
// generation mode and omitted by the legacy mutable data path.
message ServingGenerationEvidence {
  string workspace_id = 1;
  string collection = 2;
  string generation_id = 3;
  string manifest_sha256 = 4;
  uint64 applied_sequence = 5;
}

// Cluster state request
message GetClusterStateRequest {}

// Cluster state response with coordinator and shard info
message GetClusterStateResponse {
  repeated CoordinatorNode coordinators = 1;
  repeated ShardNode shards = 2;
  optional string leader_id = 3;
  string local_peer_id = 4;
  ClusterMetrics metrics = 5;
  ServingGenerationEvidence serving_generation = 6;
}

// Coordinator node information
message CoordinatorNode {
  string id = 1;
  string peer_id = 2;
  string address = 3;
  bool is_leader = 4;
  bool is_self = 5;
  NodeStatus status = 6;
}

// Shard node information
message ShardNode {
  string id = 1;
  string address = 2;
  uint64 vector_count = 3;
  float health_score = 4;
  optional float gpu_memory_percent = 5;
  optional float temperature = 6;
  NodeStatus status = 7;
}

// Node health status
enum NodeStatus {
  NODE_STATUS_UNKNOWN = 0;
  NODE_STATUS_HEALTHY = 1;
  NODE_STATUS_UNHEALTHY = 2;
}

// Cluster-wide metrics
message ClusterMetrics {
  double qps = 1;
  double p50_latency_ms = 2;
  double p95_latency_ms = 3;
  double p99_latency_ms = 4;
  float coverage = 5;
  float backpressure = 6;
  bool within_slo = 7;
}

// Batch operations
message InsertBatchRequest {
  string collection = 1;
  repeated Vector vectors = 2;
}

message Vector {
  string id = 1;
  repeated float embedding = 2;
  bytes metadata = 3;
  string text = 4;  // Optional source text for lexical (BM25) hybrid retrieval
}

message InsertBatchResponse {
  bool success = 1;
  uint32 inserted_count = 2;
  repeated string failed_ids = 3;
}

message SearchBatchRequest {
  string collection = 1;
  repeated Query queries = 2;
  uint32 top_k = 3;
  optional uint32 nprobe = 4;
}

message Query {
  repeated float vector = 1;
}

message SearchBatchResponse {
  repeated SearchResponse results = 1;
}

// Text search request (embeds text via ax-engine, then searches)
message TextSearchRequest {
  string collection = 1;
  string text = 2;
  uint32 top_k = 3;
  optional uint32 nprobe = 4;
  bool hybrid = 5;  // Fuse dense (embedded) + lexical (BM25) results via RRF
  optional float dense_weight = 6;  // RRF weight for dense results (default 1.0)
  optional float lexical_weight = 7;  // RRF weight for lexical results (default 1.0)
  bool pack = 8;  // Assemble a source-grounded, citation-bearing context pack
  optional uint32 pack_token_budget = 9;  // Token budget for the pack (default 1024)
  bool rerank = 10;  // Re-score candidates by query-text relevance (RET-005)
  bool diversity = 11;  // MMR diversity reselection to reduce near-duplicates (RET-006)
  optional float mmr_lambda = 12;  // MMR relevance/diversity tradeoff (default 0.5)
  bytes filter = 13;  // Optional metadata filter (legacy JSON)
  TagFilter tag_filter = 14;  // Optional typed tag filter
  string retrieval_mode = 15;  // Optional planner override: auto/vector/bm25/hybrid/graph/graph_hybrid
  optional float score_threshold = 16;
  string group_by = 17;
  optional uint32 group_size = 18;
  optional uint32 graph_max_depth = 19;  // default 1, hard maximum 3
  optional uint32 graph_per_seed_fanout = 20;  // default 16, hard maximum 256
  optional uint32 graph_max_expanded_nodes = 21;  // default 64, hard maximum 1024
  bool include_diagnostics = 22;
}

// ============================================
// Tag System
// ============================================

// Typed tag value
message TagValue {
  oneof value {
    string text = 1;
    double number = 2;
    bool boolean = 3;
    TextList text_list = 4;
  }
}

// List of text values for multi-value tags
message TextList {
  repeated string values = 1;
}

// Tag filter for search queries
message TagFilter {
  oneof filter_type {
    AndFilter and = 1;
    OrFilter or = 2;
    NotFilter not = 3;
    TagCondition condition = 4;
  }
}

message AndFilter {
  repeated TagFilter filters = 1;
}

message OrFilter {
  repeated TagFilter filters = 1;
}

message NotFilter {
  TagFilter filter = 1;
}

message TagCondition {
  string key = 1;
  TagValue value = 2;
  TagOperator op = 3;
}

enum TagOperator {
  TAG_OP_EQ = 0;
  TAG_OP_GT = 1;
  TAG_OP_LT = 2;
  TAG_OP_GTE = 3;
  TAG_OP_LTE = 4;
  TAG_OP_CONTAINS = 5;
  TAG_OP_EXISTS = 6;
}

// Update tags without re-embedding
message UpdateTagsRequest {
  string collection = 1;
  string document_id = 2;  // instance_id or content_hash
  map<string, TagValue> tags = 3;
  bool merge = 4;  // true = merge, false = replace
}

message UpdateTagsResponse {
  bool success = 1;
  string error = 2;
  uint32 vectors_updated = 3;
}

// ============================================
// Ingestion Service
// ============================================

service IngestionService {
  // Trigger a sync run manually
  rpc TriggerSync(TriggerSyncRequest) returns (TriggerSyncResponse);

  // Get sync status
  rpc GetSyncStatus(GetSyncStatusRequest) returns (SyncStatusResponse);

  // Update tags on existing documents
  rpc UpdateTags(UpdateTagsRequest) returns (UpdateTagsResponse);

  // Reindex a category
  rpc ReindexCategory(ReindexCategoryRequest) returns (ReindexCategoryResponse);

  // Delete a category (soft or hard)
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);

  // List categories
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
}

// Trigger sync manually
message TriggerSyncRequest {
  bool force = 1;  // Force run even if one is in progress
}

message TriggerSyncResponse {
  string run_id = 1;
  SyncRunStatus status = 2;
  string message = 3;
}

enum SyncRunStatus {
  SYNC_STARTED = 0;
  SYNC_ALREADY_RUNNING = 1;
  SYNC_DISABLED = 2;
}

// Get sync status
message GetSyncStatusRequest {}

message SyncStatusResponse {
  string last_run_id = 1;
  string last_run_status = 2;
  int64 last_run_timestamp_ms = 3;
  int64 next_run_timestamp_ms = 4;
  bool is_running = 5;
  SyncStats last_run_stats = 6;
}

message SyncStats {
  uint64 new_count = 1;
  uint64 updated_count = 2;
  uint64 marked_count = 3;
  uint64 confirmed_count = 4;
  uint64 skipped_count = 5;
}

// Reindex by category
message ReindexCategoryRequest {
  string category_uid = 1;
  bool dry_run = 2;
}

message ReindexCategoryResponse {
  bool success = 1;
  string run_id = 2;
  uint32 documents = 3;
  uint32 vectors_inserted = 4;
  uint32 vectors_tombstoned = 5;
  uint64 old_version = 6;
  uint64 new_version = 7;
  string error = 8;
}

// Delete by category
message DeleteCategoryRequest {
  string category_uid = 1;
  bool hard_delete = 2;
}

message DeleteCategoryResponse {
  bool success = 1;
  uint32 vectors_affected = 2;
}

// List categories
message ListCategoriesRequest {
  uint32 limit = 1;
  uint32 offset = 2;
}

message CategoryInfo {
  string category_uid = 1;
  uint64 vector_count = 2;
  uint64 document_count = 3;
  uint64 version = 4;
}

message ListCategoriesResponse {
  repeated CategoryInfo categories = 1;
  uint32 total_count = 2;
}

// ============================================
// Generation Management - Privileged Immutable Publication
// ============================================

// This surface is intentionally separate from the read/plan-only Operations
// Console service. Every request requires an authenticated, workspace-scoped
// control-plane identity.
service GenerationManagement {
  // Synchronously fetch, checksum, materialize, and seal one shadow
  // generation. It never changes the active generation.
  rpc StageGeneration(StageGenerationRequest) returns (GenerationReplicaStatus);
  rpc GetGenerationStatus(GetGenerationStatusRequest) returns (GenerationReplicaStatus);
  rpc ActivateGeneration(ActivateGenerationRequest) returns (GenerationReplicaStatus);
  rpc RollbackGeneration(RollbackGenerationRequest) returns (GenerationReplicaStatus);
}

message StageGenerationRequest {
  // Exact canonical JSON bytes; the digest is calculated over these bytes.
  bytes manifest_json = 1;
  string manifest_sha256 = 2;
}

message GetGenerationStatusRequest {
  string workspace_id = 1;
  string collection = 2;
}

message ActiveGenerationPrecondition {
  oneof condition {
    // Must be true; asserts this is the first activation.
    bool no_active = 1;
    // Asserts the exact currently active generation.
    string generation_id = 2;
  }
}

message ActivateGenerationRequest {
  string workspace_id = 1;
  string collection = 2;
  string generation_id = 3;
  ActiveGenerationPrecondition expected_active = 4;
}

message RollbackGenerationRequest {
  string workspace_id = 1;
  string collection = 2;
  string target_generation_id = 3;
  ActiveGenerationPrecondition expected_active = 4;
}

message LocalGenerationInfo {
  string generation_id = 1;
  string manifest_sha256 = 2;
  string bundle_sha256 = 3;
  uint64 base_sequence = 4;
  uint64 target_sequence = 5;
  uint64 applied_sequence = 6;
  string state = 7;
  optional string last_error = 8;
}

message GenerationReplicaStatus {
  uint32 schema_version = 1;
  string replica_id = 2;
  string workspace_id = 3;
  string collection = 4;
  LocalGenerationInfo active = 5;
  LocalGenerationInfo previous = 6;
  LocalGenerationInfo staged = 7;
  uint64 updated_at_ms = 8;
}

// ============================================
// Management Service - Read/Plan-Only Operations Console
// ============================================

// Version 1 deliberately exposes no data, identity, snapshot, or recovery
// execution methods. PlanImport validates a server-issued staged object but
// never publishes ingestion work or writes database records.
service ManagementService {
  rpc GetManagementCapabilities(GetManagementCapabilitiesRequest) returns (GetManagementCapabilitiesResponse);
  rpc ListManagementOperations(ListManagementOperationsRequest) returns (ListManagementOperationsResponse);
  rpc GetManagementOperation(GetManagementOperationRequest) returns (ManagementOperation);
  rpc ListSnapshots(ListSnapshotsRequest) returns (ListSnapshotsResponse);
  rpc GetSnapshot(GetSnapshotRequest) returns (SnapshotOperationalInfo);
  rpc PlanImport(PlanImportRequest) returns (ManagementPlan);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
}

message GetManagementCapabilitiesRequest {}

message ManagementCapability {
  string name = 1;
  bool supported = 2;
  bool authorized = 3;
  string unavailable_reason = 4;
}

message GetManagementCapabilitiesResponse {
  string server_version = 1;
  uint32 management_api_version = 2;
  repeated ManagementCapability capabilities = 3;
  string workspace_id = 4;
  optional string agent_id = 5;
  bool authenticated = 6;
  bool tls_active = 7;
  string auth_mode = 8;
}

enum ManagementOperationType {
  MANAGEMENT_OPERATION_UNSPECIFIED = 0;
  INGEST_DOCUMENTS = 1;
  IMPORT_RECORDS = 2;
  EXPORT_RECORDS = 3;
  CREATE_SNAPSHOT = 4;
  VERIFY_SNAPSHOT = 5;
  RESTORE_SNAPSHOT = 6;
  REBUILD_INDEX = 7;
}

enum ManagementOperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_QUEUED = 1;
  OPERATION_RUNNING = 2;
  OPERATION_SUCCEEDED = 3;
  OPERATION_FAILED = 4;
  OPERATION_CANCELLED = 5;
}

message OperationProblem {
  string reason_code = 1;
  string message = 2;
  optional string item_ref = 3;
  bool retryable = 4;
}

message ManagementOperation {
  string operation_id = 1;
  ManagementOperationType type = 2;
  ManagementOperationState state = 3;
  string target_type = 4;
  string target_id = 5;
  string workspace_id = 6;
  string actor_id = 7;
  int64 created_at_ms = 8;
  optional int64 started_at_ms = 9;
  int64 updated_at_ms = 10;
  optional int64 completed_at_ms = 11;
  optional float progress_percent = 12;
  uint64 items_discovered = 13;
  uint64 items_processed = 14;
  uint64 items_skipped = 15;
  uint64 items_failed = 16;
  uint64 bytes_processed = 17;
  bool cancellable = 18;
  bool retryable = 19;
  optional string plan_id = 20;
  optional string plan_hash = 21;
  repeated OperationProblem problems = 22;
  uint32 total_problem_count = 23;
}

message ListManagementOperationsRequest {
  optional ManagementOperationType type_filter = 1;
  optional ManagementOperationState state_filter = 2;
  optional string target_type = 3;
  optional string target_id = 4;
  optional int64 since_timestamp_ms = 5;
  uint32 limit = 6;
  string cursor = 7;
}

message ListManagementOperationsResponse {
  repeated ManagementOperation operations = 1;
  string next_cursor = 2;
  uint32 total_count = 3;
}

message GetManagementOperationRequest {
  string operation_id = 1;
}

enum VerificationState {
  VERIFICATION_UNKNOWN = 0;
  VERIFICATION_PENDING = 1;
  VERIFICATION_VALID = 2;
  VERIFICATION_INVALID = 3;
}

enum RestoreTestState {
  RESTORE_TEST_NEVER = 0;
  RESTORE_TEST_PASSED = 1;
  RESTORE_TEST_FAILED = 2;
}

message SnapshotOperationalInfo {
  string snapshot_id = 1;
  string collection = 2;
  optional string shard_id = 3;
  int64 created_at_ms = 4;
  uint64 size_bytes = 5;
  string format_version = 6;
  string akidb_version = 7;
  bool manifest_present = 8;
  VerificationState verification_state = 9;
  optional int64 verified_at_ms = 10;
  RestoreTestState restore_test_state = 11;
  optional int64 restore_tested_at_ms = 12;
  optional string restore_test_target = 13;
  optional int64 expires_at_ms = 14;
}

message ListSnapshotsRequest {
  optional string collection = 1;
  uint32 limit = 2;
  string cursor = 3;
}

message ListSnapshotsResponse {
  repeated SnapshotOperationalInfo snapshots = 1;
  string next_cursor = 2;
  uint32 total_count = 3;
}

message GetSnapshotRequest {
  string snapshot_id = 1;
}

message StagedObjectRef {
  string staging_id = 1;
  string object_id = 2;
  string etag = 3;
  uint64 size_bytes = 4;
}

enum PlanSeverity {
  PLAN_INFO = 0;
  PLAN_WARNING = 1;
  PLAN_ERROR = 2;
}

message PlanFinding {
  string code = 1;
  PlanSeverity severity = 2;
  string message = 3;
  optional string item_ref = 4;
}

message PlanImportRequest {
  StagedObjectRef source = 1;
  string collection = 2;
  string workspace_id = 3;
  string duplicate_policy = 4;
}

message ManagementPlan {
  string plan_id = 1;
  string plan_hash = 2;
  string kind = 3;
  string target_type = 4;
  string target_id = 5;
  string workspace_id = 6;
  string source_fingerprint = 7;
  int64 created_at_ms = 8;
  int64 expires_at_ms = 9;
  bool executable = 10;
  string required_execute_permission = 11;
  uint64 source_bytes = 12;
  optional uint64 estimated_expanded_bytes = 13;
  optional uint64 estimated_documents = 14;
  optional uint64 estimated_chunks = 15;
  optional uint64 estimated_vectors = 16;
  repeated PlanFinding findings = 17;
}

message AuditEvent {
  string event_id = 1;
  int64 occurred_at_ms = 2;
  string actor_id = 3;
  string workspace_id = 4;
  string action = 5;
  string target_type = 6;
  string target_id = 7;
  string outcome = 8;
  string reason_code = 9;
  string request_id = 10;
  string source = 11;
}

message ListAuditEventsRequest {
  optional string action = 1;
  optional string outcome = 2;
  optional int64 since_timestamp_ms = 3;
  uint32 limit = 4;
  string cursor = 5;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  string next_cursor = 2;
  uint32 total_count = 3;
  string retention_notice = 4;
  string integrity_status = 5;
}

// ============================================
// Admin Service - Background Task Management
// ============================================

service AdminService {
  // Get status of all background tasks
  rpc GetBackgroundTaskStatus(GetBackgroundTaskStatusRequest) returns (GetBackgroundTaskStatusResponse);

  // List task execution history
  rpc GetTaskHistory(GetTaskHistoryRequest) returns (GetTaskHistoryResponse);

  // Trigger a snapshot manually
  rpc TriggerSnapshot(TriggerSnapshotRequest) returns (TriggerSnapshotResponse);

  // Trigger an index rebuild manually
  rpc TriggerRebuild(TriggerRebuildRequest) returns (TriggerRebuildResponse);

  // Cancel a running task
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);

  // Get resource governor status
  rpc GetResourceStatus(GetResourceStatusRequest) returns (GetResourceStatusResponse);

  // Configure webhook alerts
  rpc ConfigureWebhook(ConfigureWebhookRequest) returns (ConfigureWebhookResponse);

  // Get current webhook configuration
  rpc GetWebhookConfig(GetWebhookConfigRequest) returns (GetWebhookConfigResponse);
}

// ============================================
// Background Task Status
// ============================================

message GetBackgroundTaskStatusRequest {
  optional string task_type = 1;  // Filter by task type
  optional string task_id = 2;    // Filter by task ID
}

message GetBackgroundTaskStatusResponse {
  repeated BackgroundTaskInfo tasks = 1;
  ResourceStatus resource_status = 2;
}

message BackgroundTaskInfo {
  string task_type = 1;
  string task_id = 2;
  string description = 3;
  TaskStatus status = 4;
  TaskScheduleInfo schedule = 5;
  optional TaskExecutionInfo current_execution = 6;
  optional TaskExecutionInfo last_execution = 7;
  ResourceRequirementsInfo requirements = 8;
  bool enabled = 9;
}

enum TaskStatus {
  TASK_STATUS_IDLE = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_COMPLETED = 3;
  TASK_STATUS_FAILED = 4;
  TASK_STATUS_CANCELLED = 5;
  TASK_STATUS_DISABLED = 6;
}

message TaskScheduleInfo {
  oneof schedule_type {
    string cron = 1;           // Cron expression
    uint64 interval_ms = 2;    // Interval in milliseconds
    bool once = 3;             // Run once
    bool manual = 4;           // Manual trigger only
  }
  optional int64 next_run_timestamp_ms = 5;
}

message TaskExecutionInfo {
  string execution_id = 1;
  int64 started_at_ms = 2;
  optional int64 completed_at_ms = 3;
  TaskStatus status = 4;
  optional string message = 5;
  optional string error = 6;
  float progress = 7;           // 0-100
  optional uint64 items_processed = 8;
  optional uint64 bytes_processed = 9;
  uint64 duration_ms = 10;
  uint32 retry_attempt = 11;
}

message ResourceRequirementsInfo {
  uint32 cpu_weight = 1;
  uint32 memory_mb = 2;
  uint32 io_weight = 3;
  bool uses_gpu = 4;
}

// ============================================
// Task History
// ============================================

message GetTaskHistoryRequest {
  optional string task_type = 1;
  optional string task_id = 2;
  uint32 limit = 3;             // Default 50
  optional int64 since_timestamp_ms = 4;
  optional TaskStatus status_filter = 5;
}

message GetTaskHistoryResponse {
  repeated TaskExecutionRecord executions = 1;
  uint32 total_count = 2;
}

message TaskExecutionRecord {
  string execution_id = 1;
  string task_type = 2;
  string task_id = 3;
  TaskStatus status = 4;
  int64 started_at_ms = 5;
  optional int64 completed_at_ms = 6;
  uint64 duration_ms = 7;
  optional string message = 8;
  optional string error = 9;
  optional uint64 items_processed = 10;
  optional uint64 bytes_processed = 11;
  uint32 retry_attempt = 12;
}

// ============================================
// Snapshot Trigger
// ============================================

message TriggerSnapshotRequest {
  bool force = 1;               // Force even if one is in progress
  optional string shard_id = 2; // Specific shard (empty = all)
}

message TriggerSnapshotResponse {
  bool accepted = 1;
  string snapshot_id = 2;
  string message = 3;
  SnapshotStatus current_status = 4;
}

enum SnapshotStatus {
  SNAPSHOT_IDLE = 0;
  SNAPSHOT_COMPRESSING = 1;
  SNAPSHOT_UPLOADING = 2;
  SNAPSHOT_VERIFYING = 3;
  SNAPSHOT_COMPLETING = 4;
  SNAPSHOT_FAILED = 5;
  SNAPSHOT_COMPLETED = 6;
}

// ============================================
// Rebuild Trigger
// ============================================

message TriggerRebuildRequest {
  bool force = 1;               // Force even if one is in progress
  optional string shard_id = 2; // Specific shard (empty = all)
  bool compact_tombstones = 3;  // Whether to compact tombstones
}

message TriggerRebuildResponse {
  bool accepted = 1;
  string rebuild_id = 2;
  string message = 3;
  RebuildStatus current_status = 4;
}

enum RebuildStatus {
  REBUILD_IDLE = 0;
  REBUILD_PREPARING = 1;
  REBUILD_SCANNING = 2;
  REBUILD_BUILDING = 3;
  REBUILD_REPLAYING = 4;
  REBUILD_VALIDATING = 5;
  REBUILD_SWAPPING = 6;
  REBUILD_CLEANING = 7;
  REBUILD_FAILED = 8;
  REBUILD_COMPLETED = 9;
}

// ============================================
// Task Cancellation
// ============================================

message CancelTaskRequest {
  string execution_id = 1;      // Specific execution
  optional string task_type = 2; // Or cancel by type
  optional string task_id = 3;  // Or cancel by task ID
}

message CancelTaskResponse {
  bool success = 1;
  string message = 2;
  repeated string cancelled_execution_ids = 3;
}

// ============================================
// Resource Status
// ============================================

message GetResourceStatusRequest {}

message GetResourceStatusResponse {
  ResourceStatus status = 1;
}

message ResourceStatus {
  uint32 running_tasks = 1;
  uint32 max_concurrent_tasks = 2;
  uint64 p95_latency_ms = 3;
  uint64 latency_threshold_ms = 4;
  uint32 cpu_percent = 5;
  uint32 memory_mb = 6;
  uint32 max_memory_mb = 7;
  bool can_accept_tasks = 8;
  bool in_cooldown = 9;
  optional uint64 cooldown_remaining_ms = 10;
  repeated RunningTaskInfo running = 11;
}

message RunningTaskInfo {
  string task_id = 1;
  string task_type = 2;
  int64 started_at_ms = 3;
  uint64 elapsed_ms = 4;
  ResourceRequirementsInfo requirements = 5;
}

// ============================================
// Webhook Configuration
// ============================================

message ConfigureWebhookRequest {
  string url = 1;
  repeated WebhookEvent events = 2;
  optional string secret = 3;   // For HMAC signing
  bool enabled = 4;
}

enum WebhookEvent {
  WEBHOOK_TASK_STARTED = 0;
  WEBHOOK_TASK_COMPLETED = 1;
  WEBHOOK_TASK_FAILED = 2;
  WEBHOOK_SNAPSHOT_COMPLETED = 3;
  WEBHOOK_REBUILD_COMPLETED = 4;
  WEBHOOK_SLO_BREACH = 5;
  WEBHOOK_RESOURCE_EXHAUSTED = 6;
}

message ConfigureWebhookResponse {
  bool success = 1;
  string message = 2;
}

message GetWebhookConfigRequest {}

message GetWebhookConfigResponse {
  optional string url = 1;
  repeated WebhookEvent events = 2;
  bool enabled = 3;
  optional int64 last_delivery_timestamp_ms = 4;
  optional bool last_delivery_success = 5;
}
