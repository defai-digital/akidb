[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "akidb"
version = "0.6.0"
description = "Python SDK for AkiDB — a Mac-native retrieval memory engine for private AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "grpcio-tools>=1.60",
]

[tool.setuptools]
packages = ["akidb"]
