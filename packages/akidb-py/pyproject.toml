[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "akidb"
version = "0.1.0"
description = "AkiDB — embedded vector database for Python (Rust-powered)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/defai-digital/akidb"
Repository = "https://github.com/defai-digital/akidb"
Licensing = "https://github.com/defai-digital/akidb/blob/main/LICENSE"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "akidb._native"

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
