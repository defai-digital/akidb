name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # Fast checks that run on every PR
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (portable path)
        run: cargo clippy --workspace --all-targets

      - name: Check (no default features)
        run: cargo check --workspace --no-default-features

  # Unit tests on the established Mac ARM64 path and Ubuntu AMD64 target.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 AMD64
            os: ubuntu-24.04
          - name: macOS 26 ARM64
            os: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace --verbose

  # Explicit macOS 26 Apple Silicon validation path for M2 or later hosts.
  macos-arm64:
    name: macOS 26 Apple Silicon
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install protoc
        run: brew install protobuf

      - name: Check host architecture
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"

      - name: Run Apple Silicon build script
        run: ./scripts/build-on-mac-arm64.sh

  # Opt-in cloud path: real S3 protocol, immutable generation publication,
  # atomic cutover, process restart, and rollback on Ubuntu 24.04 AMD64.
  generation-serving-preview:
    name: Generation Serving Preview (Ubuntu 24.04 AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python gRPC runtime
        working-directory: sdks/python
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .

      - name: Run real MinIO generation gate
        env:
          CARGO_TARGET_DIR: target
        run: ./scripts/test-generation-serving-minio.sh

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject sensitive or local-only files
        run: python3 scripts/check-sensitive-files.py

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Artifact and validation pipeline smoke tests that do not require real
  # four-Mac hardware.
  validation-smoke:
    name: Validation Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Four-Mac evidence pipeline smoke
        run: ./scripts/smoke-four-mac-validation.sh

  # Python service tests
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [doc-parser, upload-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: |
          pytest tests/ -v || true

      - name: Run ruff
        working-directory: services/${{ matrix.service }}
        run: |
          pip install ruff
          ruff check . || true

  # Test ingestion orchestrator crate
  test-ingestion:
    name: Test Ingestion Orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ingestion-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ingestion tests
        run: cargo test -p akidb-ingestion --verbose
