name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # Fast checks that run on every PR
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (portable path)
        run: cargo clippy --workspace --all-targets

      - name: Check (no default features)
        run: cargo check --workspace --no-default-features

  # Unit tests on every supported operating-system and architecture target.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 AMD64
            os: ubuntu-24.04
          - name: macOS 26 ARM64
            os: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace --verbose

  # Explicit macOS 26 Apple Silicon validation path for M2 or later hosts.
  macos-arm64:
    name: macOS 26 Apple Silicon
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install protoc
        run: brew install protobuf

      - name: Check host architecture
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "26"

      - name: Run Apple Silicon build script
        run: ./scripts/build-on-mac-arm64.sh

  # Opt-in cloud path: real S3 protocol, immutable generation publication,
  # atomic cutover, process restart, and rollback on Ubuntu 24.04 AMD64.
  generation-serving-preview:
    name: Generation Serving Preview (Ubuntu 24.04 AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python gRPC runtime
        working-directory: sdks/python
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .

      - name: Run real MinIO generation gate
        env:
          CARGO_TARGET_DIR: target
        run: ./scripts/test-generation-serving-minio.sh

  # Phase 3 correctness gate: three independent blank replica volumes rebuild
  # the same bundle + mutation tail through the PostgreSQL authority.
  replica-convergence:
    name: PostgreSQL replica convergence (Ubuntu 24.04 AMD64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: akidb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase3-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d akidb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libclang-dev \
            libssl-dev \
            pkg-config \
            protobuf-compiler

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run three-replica convergence and replacement gate
        env:
          AKIDB_KNOWLEDGE_POSTGRES_URL: >-
            postgres://postgres:phase3-ci-only@127.0.0.1:5432/akidb_test
        run: >-
          cargo test -p akidb-grpc --features generation-postgres
          three_blank_replicas_converge_rebuild_and_isolate_a_gap
          -- --ignored --nocapture

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject sensitive or local-only files
        run: python3 scripts/check-sensitive-files.py

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Artifact and validation pipeline smoke tests that do not require real
  # four-Mac hardware.
  validation-smoke:
    name: Validation Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible syntax validator
        run: pip install ansible-core==2.21.2

      - name: Four-Mac evidence pipeline smoke
        run: ./scripts/smoke-four-mac-validation.sh

      - name: Knowledge gateway load-driver tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Knowledge qualification playbook syntax
        working-directory: deploy/ansible
        env:
          AKIDB_READINESS_FAULT_REPLICA: knowledge-1
          AKIDB_MARKET_SERVER: knowledge-3
          AKIDB_MARKET_DRIVER: knowledge-4
          AKIDB_GRAPH_SERVER: knowledge-3
          AKIDB_COMPETITOR_RUN_ID: syntax-run-001
          AKIDB_COMPETITOR_SERVER: knowledge-3
          AKIDB_COMPETITOR_DRIVER: knowledge-4
          AKIDB_COMPETITOR_DATASET_DIR: /var/tmp/akidb-market-data/sift1m
          AKIDB_COMPETITOR_OUTPUT_DIR: /tmp/akidb-competitor-syntax
          AKIDB_COMPETITOR_CONFIRM: yes-run-isolated-market-competitors
          AKIDB_COMPETITOR_MINIO_ACCESS_KEY: qualification
          AKIDB_COMPETITOR_MINIO_SECRET_KEY: qualification-only-secret
          AKIDB_PARITY_AKI_EVIDENCE_DIR: /tmp/akidb-ann-syntax
          AKIDB_PARITY_AKI_RUN_ID: sift1m-syntax-run
        run: |
          ansible-playbook \
            -i inventories/example/knowledge-hosts.yml \
            playbooks/knowledge-load-test.yml \
            --syntax-check
          ansible-playbook \
            -i inventories/example/knowledge-hosts.yml \
            playbooks/knowledge-failure-under-load.yml \
            --syntax-check
          ansible-playbook \
            -i inventories/example/knowledge-hosts.yml \
            playbooks/knowledge-market-ann.yml \
            --syntax-check
          ansible-playbook \
            -i inventories/example/knowledge-hosts.yml \
            playbooks/knowledge-market-graph.yml \
            --syntax-check
          ansible-playbook \
            -i inventories/example/knowledge-hosts.yml \
            playbooks/knowledge-market-competitors.yml \
            --syntax-check

  # Python service tests
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [doc-parser, upload-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: pytest tests/ -v

      - name: Run ruff
        working-directory: services/${{ matrix.service }}
        run: |
          pip install ruff
          ruff check .

  # Test ingestion orchestrator crate
  test-ingestion:
    name: Test Ingestion Orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ingestion-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ingestion tests
        run: cargo test -p akidb-ingestion --verbose
