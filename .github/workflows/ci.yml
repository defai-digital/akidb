name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Fast checks that run on every PR
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy (portable features)
        run: cargo clippy --workspace --all-targets --features cpu,cuvs

      - name: Check (no default features)
        run: cargo check --workspace --no-default-features

  # Unit tests on Mac and Linux
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (CPU features)
        run: cargo test --workspace --features cpu --verbose

  # Explicit Apple Silicon validation path for M2 or later development hosts.
  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-apple-darwin

      - name: Check host architecture
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Run Apple Silicon build script
        run: ./scripts/build-on-mac-arm64.sh

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  # Documentation
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build docs
        run: cargo doc --workspace --no-deps --features cpu,cuvs
        env:
          RUSTDOCFLAGS: -D warnings

  # Cross-compile for ARM64 (Thor target)
  cross-compile:
    name: Cross Compile (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Cross compile check
        run: |
          cargo check --target aarch64-unknown-linux-gnu --features cpu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  # Python service tests
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [doc-parser, upload-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: |
          pytest tests/ -v || true

      - name: Run ruff
        working-directory: services/${{ matrix.service }}
        run: |
          pip install ruff
          ruff check . || true

  # Test ingestion orchestrator crate
  test-ingestion:
    name: Test Ingestion Orchestrator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-ingestion-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ingestion tests
        run: cargo test -p akidb-ingestion --verbose

  # GPU tests - only on self-hosted Thor runners
  gpu-test:
    name: GPU Tests (Thor)
    runs-on: [self-hosted, jetson-thor]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test, test-ingestion]
    steps:
      - uses: actions/checkout@v4

      - name: Check CUDA availability
        run: nvidia-smi

      - name: Run GPU tests
        run: cargo test --workspace --no-default-features --features gpu --verbose

      - name: Run benchmarks
        run: cargo bench --workspace --no-default-features --features gpu -- --noplot
