name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

# Release job must be able to create/update GitHub releases and attach artifacts.
# Job-level contents:write elevates above the repo default when elevation is allowed.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        run: brew install protobuf

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/akidb dist/
          cp target/${{ matrix.target }}/release/akidb-server dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/akidb-coordinator dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/akidb-tui dist/ 2>/dev/null || true
          tar -czvf akidb-${{ matrix.target }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: akidb-${{ matrix.target }}
          path: akidb-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            akidb-*/akidb-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
