name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64 (development)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: cpu

          # Linux ARM64 (Jetson Thor production)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            features: cpu
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/akidb-server dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/akidb-coordinator dist/ 2>/dev/null || true
          tar -czvf akidb-${{ matrix.target }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: akidb-${{ matrix.target }}
          path: akidb-${{ matrix.target }}.tar.gz

  # Build GPU-enabled binary on Thor hardware
  build-gpu:
    name: Build GPU (Thor)
    runs-on: [self-hosted, jetson-thor]
    steps:
      - uses: actions/checkout@v4

      - name: Build with GPU features
        run: cargo build --release --features gpu

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/akidb-server dist/
          tar -czvf akidb-aarch64-gpu.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: akidb-aarch64-gpu
          path: akidb-aarch64-gpu.tar.gz

  release:
    name: Create Release
    needs: [build, build-gpu]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            akidb-*/akidb-*.tar.gz
          generate_release_notes: true
