# AkiDB TUI Dashboard Configuration

# Refresh interval in milliseconds
refresh_interval_ms = 500

# GPU metrics are unavailable in the supported CPU-portable build.
show_gpu_metrics = false

# Coordinator address (optional, can also use --coordinator CLI flag)
# coordinator_address = "127.0.0.1:50050"

# Authenticated read/plan management endpoint (optional; defaults to shard 50051)
# management_address = "127.0.0.1:50051"

# Use mock data for testing
mock_mode = false

[theme]
# Theme: "default", "minimal", "high-contrast"
name = "default"

[layout]
# Show topology panel
show_topology = true

# Show metrics panel
show_metrics = true

# Show health sparklines
show_health = true

[controls]
# Reserved legacy flag. Operations Console v1 never evicts nodes.
allow_eviction = false

# Require quorum confirmation for destructive actions
require_quorum_confirmation = true
