# AkiDB Thor Edition - Default Configuration

[server]
host = "0.0.0.0"
port = 8080
grpc_port = 50051
tls_enabled = false
# tls_cert_path = "/etc/akidb/certs/server.crt"
# tls_key_path = "/etc/akidb/certs/server.key"

[index]
index_type = "IVF4096,Flat"
nlist = 4096
nprobe = 32

[index.gpu]
enabled = true
device_id = 0
memory_fraction = 0.6
fallback_to_cpu = true

[index.rebuild]
tombstone_ratio_trigger = 0.10
max_duration_seconds = 300
preferred_hours = [2, 3, 4]

[index.tombstone]
use_gpu_bitset = true
max_count = 100000

[storage]
rocksdb_path = "./data/rocksdb"
wal_enabled = true
wal_path = "./data/wal"

[storage.minio]
endpoint = "localhost:9000"
bucket = "akidb-snapshots"
access_key = "akidb-admin"
secret_key = "akidb-secret-key"
use_ssl = false

[observability]
tracing_enabled = true
otlp_endpoint = "http://localhost:4317"
metrics_enabled = true
metrics_port = 9090
log_level = "info"
log_format = "json"

[slo]
[slo.reference]
dimensions = 768
vectors_per_shard = 1000000
top_k = 10
nprobe = 32
batch_size = 1
target_p95_ms = 50

[slo.backpressure]
soft_breach_ms = 50
hard_breach_ms = 75
degraded_mode_enabled = true
