# AkiDB macOS Apple Silicon - Default Configuration

[server]
host = "0.0.0.0"
port = 8080
grpc_port = 50051
tls_enabled = false
# tls_cert_path = "/etc/akidb/certs/server.crt"
# tls_key_path = "/etc/akidb/certs/server.key"

[index]
index_type = "HNSW"
hnsw_m = 16
hnsw_ef_construction = 128
hnsw_ef_search = 64

[index.rebuild]
tombstone_ratio_trigger = 0.10
max_duration_seconds = 300
preferred_hours = [2, 3, 4]

[index.tombstone]
max_count = 100000

[storage]
rocksdb_path = "./data/rocksdb"
wal_enabled = true
wal_path = "./data/wal"

[storage.minio]
endpoint = "localhost:9000"
bucket = "akidb-snapshots"
access_key = "akidb-admin"
secret_key = "akidb-secret-key"
use_ssl = false

[sql]
enabled = false
backend = "sqlite"
sqlite_path = "./data/akidb-metadata.sqlite"
# postgres_url = "postgres://user:pass@localhost:5432/akidb"

[observability]
tracing_enabled = true
otlp_endpoint = "http://localhost:4317"
metrics_enabled = true
metrics_port = 9090
log_level = "info"
log_format = "json"

[slo]
[slo.reference]
dimensions = 768
vectors_per_shard = 1000000
top_k = 10
nprobe = 32
batch_size = 1
target_p95_ms = 50

[slo.backpressure]
soft_breach_ms = 50
hard_breach_ms = 75
degraded_mode_enabled = true

[embedding]
enabled = false
url = "http://127.0.0.1:8081/v1/embeddings"
model = "Qwen/Qwen3-Embedding-4B"
dimensions = 2560
timeout_ms = 10000
max_batch_size = 32
