# AkiDB portable runtime - Default Configuration

[server]
# Secure appliance default: loopback only (ADR-0002.2). Use 0.0.0.0 only with auth.
host = "127.0.0.1"
port = 8080
grpc_port = 50051
tls_enabled = false
# tls_cert_path = "/etc/akidb/certs/server.crt"
# tls_key_path = "/etc/akidb/certs/server.key"

[auth]
# loopback_optional | required | disabled
mode = "loopback_optional"
token_file = "./data/auth.token"
# token = "set-explicitly-or-use-AKIDB_AUTH_TOKEN"
authorization_epoch = 1

[auth.acl]
default_workspace = "default"
enforce_workspace = true

[auth.memory]
# Authoritative Memory is one workspace per process during the experimental
# and developer-preview profiles. Empty inherits auth.acl.default_workspace.
workspace_id = "default"
allow_legacy_principal = false
allow_unauthenticated_loopback = false

# Example principal. Uncomment and use a private file or environment variable;
# never commit a credential token.
# [[auth.principals]]
# principal_id = "service:coding-agent"
# kind = "service"
# active = true
# grant_version = 1
# workspaces = ["default"]
# namespaces = ["repo/**"]
# agent_ids = ["agent:codex"]
# allow_shared_memory = false
# entity_keys = ["service:ingestion", "repo:akidb"]
# data_subject_ids = ["**"]
# session_ids = ["**"]
# task_ids = ["**"]
# sensitivities = ["public", "internal"]
# purposes = ["debugging"]
# capabilities = [
#   "memory.observe", "memory.propose", "memory.remember", "memory.read",
#   "memory.recall", "memory.correct", "memory.retract", "memory.forget",
#   "memory.history", "memory.export", "memory.replay",
#   "memory.delete.plan", "memory.delete.execute",
# ]
#
# [[auth.principals.credentials]]
# credential_id = "coding-agent-local"
# token_env = "AKIDB_MEMORY_PRINCIPAL_TOKEN"
# active = true

[memory]
# Disabled by default. Enabling this exposes an experimental, separately
# authenticated MemoryService; it does not change legacy memory_write/read.
enabled = false
rocksdb_path = "./data/memory-rocksdb"
max_recall_items = 100
max_candidates = 5000
default_context_token_budget = 1024
snapshot_max_bytes = 4194304

[memory.retention]
# Zero is an explicit indefinite window. Finite values fail startup until a
# verified GC executor exists; source/subject deletion remains separately
# enforced by checksum-bound plans and non-resurrection tombstones.
raw_event_seconds = 0
memory_version_seconds = 0
compiler_artifact_seconds = 0
index_artifact_seconds = 0
audit_seconds = 0
snapshot_seconds = 0

[management]
audit_max_entries = 1000

[management.import_plan]
# Keep disabled until the upload gateway provides server-issued immutable
# staging references to the management service.
enabled = false
max_source_bytes = 104857600
max_expanded_bytes = 536870912
plan_ttl_seconds = 300

# Immutable generation serving. Without replica_control this remains the
# Phase 2 single-node preview; automatic client failover is a later phase.
[generation_serving]
enabled = false
# Required and stable for the lifetime of the local data volume when enabled.
replica_id = ""
generation_root = "./data/generations"
control_rocksdb_path = "./data/generation-control"
download_path = "./data/generation-downloads"
default_collection = "default"
# Always required by GenerationManagement and intentionally separate from the
# read data-plane token. AKIDB_GENERATION_CONTROL_TOKEN overrides this file.
control_token_file = "./data/generation-control.token"
# control_token = "set-explicitly-or-use-AKIDB_GENERATION_CONTROL_TOKEN"
# Empty restricts publication to storage.minio.bucket.
allowed_buckets = []
s3_region = "us-east-1"
# Require ?versionId=... or a checksum-addressed S3 key.
require_version_or_digest_key = true
max_bundle_size_bytes = 53687091200
max_vectors = 10000000
max_graph_nodes = 20000000
max_graph_edges = 50000000
# Reject a generation before building if the estimated shadow would leave less
# than this reserve. Qualification inventory should raise it for larger tiers.
minimum_free_bytes_after_build = 1073741824
estimated_build_overhead_percent = 200

[generation_serving.replica_control]
enabled = false
# Database credentials are read only from this environment variable.
postgres_url_env = "AKIDB_KNOWLEDGE_POSTGRES_URL"
# require (production default) | disable (loopback-only development/tests)
postgres_tls_mode = "require"
# postgres_ca_certificate_path = "/etc/akidb/certs/postgres-ca.pem"
endpoint = ""
failure_domain = ""
poll_interval_ms = 1000
heartbeat_interval_ms = 5000
index_format_version = "akidb-generation-v1"
supported_graph_schema_versions = ["ax.knowledge-graph.v1"]
generation_gc_enabled = false
generation_gc_interval_ms = 3600000
generation_gc_minimum_age_ms = 86400000
generation_gc_dry_run = true

[index]
index_type = "HNSW"
hnsw_m = 16
hnsw_ef_construction = 128
hnsw_ef_search = 64
# f32 (default) or f16 for lower RAM (GAP-010)
vector_precision = "f32"
# cosine | l2 | ip
metric = "cosine"

[index.filter]
# pre | post | adaptive (GAP-003)
mode = "adaptive"
postfilter_overfetch_factor = 5
max_postfilter_candidates = 16384
adaptive_pre_selectivity = 0.20

[index.rebuild]
tombstone_ratio_trigger = 0.10
max_duration_seconds = 300
preferred_hours = [2, 3, 4]

[index.tombstone]
max_count = 100000

[storage]
rocksdb_path = "./data/rocksdb"
wal_enabled = true
wal_path = "./data/wal"

[storage.minio]
endpoint = "localhost:9000"
bucket = "akidb-snapshots"
access_key = "akidb-admin"
secret_key = "akidb-secret-key"
use_ssl = false

[sql]
enabled = false
backend = "sqlite"
sqlite_path = "./data/akidb-metadata.sqlite"
# postgres_url = "postgres://user:pass@localhost:5432/akidb"

[observability]
tracing_enabled = true
otlp_endpoint = "http://localhost:4317"
metrics_enabled = true
metrics_port = 9090
log_level = "info"
log_format = "json"

[slo]
[slo.reference]
dimensions = 768
vectors_per_shard = 1000000
top_k = 10
nprobe = 32
batch_size = 1
target_p95_ms = 50

[slo.backpressure]
soft_breach_ms = 50
hard_breach_ms = 75
degraded_mode_enabled = true

[embedding]
enabled = false
url = "http://127.0.0.1:8081/v1/embeddings"
model = "Qwen/Qwen3-Embedding-4B"
dimensions = 2560
timeout_ms = 10000
max_batch_size = 32
