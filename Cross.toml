[build.env]
passthrough = [
    "RUST_BACKTRACE",
    "RUST_LOG",
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"

# Pre-build script to install dependencies in the container
pre-build = [
    "apt-get update && apt-get install -y libssl-dev pkg-config"
]
